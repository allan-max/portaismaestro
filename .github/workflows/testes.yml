name: testes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  testes:
    # Produção roda em Windows Server 2012 R2 com Node 18 (mínimo do Express 5); o Ubuntu cobre o Node atual
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 18
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high

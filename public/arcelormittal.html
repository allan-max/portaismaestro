<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAESTRO | ArcelorMittal - Robô de Licitações</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Títulos e números em Sora (o resto dos portais usa Inter) */
        h2, h3, .kpi-num, .status-text-val {
            font-family: 'Sora', 'Manrope', sans-serif;
        }

        :root {
            --laranja: #f4511e;
            --laranja-escuro: #e03e0c;
            --tinta: #0f172a;
            --cinza: #64748b;
            --borda: #eef1f5;
            --verde: #16a34a;
            --sombra-card: 0 6px 24px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
        }

        /* TRAVAMENTO TOTAL DE SCROLLBAR (100% ONE-PAGE VIEWPORT) */
        html, body {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            background-color: #f8fafc;
            color: var(--tinta);
            overflow: hidden;
        }

        .page-container {
            display: flex;
            height: 100vh;
            max-height: 100vh;
            width: 100%;
            background-color: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        /* =========================================================
           PAINEL LATERAL ESQUERDO: FOTOGRAFIA SIDERÚRGICA & CURVA ORGÂNICA
           ========================================================= */
        .left-pane {
            flex: 0 0 36%;
            min-width: 400px;
            /* limita pela altura: a arte tem fragmentos de UI a partir de ~78% da largura */
            max-width: 76vh;
            height: 100vh;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .left-panel-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: left center;
            pointer-events: none;
        }

        /* =========================================================
           FLOATING TOP NAVBAR (BARRA SUPERIOR FLUTUANTE)
           ========================================================= */
        .floating-navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            padding: 4px 7px;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 15px;
            border-radius: 40px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #e2e8f0;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .nav-item i {
            font-size: 0.82rem;
        }

        .nav-item:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active.nav-arcelormittal {
            background: var(--laranja);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(244, 81, 30, 0.45);
        }

        .nav-item.nav-voltar {
            color: #ff7a59;
            padding-left: 12px;
        }

        .nav-item.nav-voltar:hover {
            color: #ffa58f;
            background: rgba(239, 68, 68, 0.15);
        }

        /* =========================================================
           LADO DIREITO: PAINEL DE OPERAÇÃO (SEM SCROLL)
           ========================================================= */
        .right-pane {
            flex: 1;
            min-width: 0;
            height: 100vh;
            max-height: 100vh;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(64px, 9vh, 90px) clamp(16px, 1.6vw, 28px) clamp(14px, 3vh, 36px) clamp(12px, 1.4vw, 24px);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .top-header-bar {
            position: absolute;
            top: clamp(14px, 3vh, 28px);
            right: clamp(16px, 2.2vw, 40px);
            display: flex;
            align-items: center;
            height: 28px;
            z-index: 10;
        }

        .lang-selector {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.86rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            user-select: none;
            transition: color 0.15s;
        }

        .lang-selector:hover {
            color: var(--laranja);
        }

        .lang-selector i:last-child {
            font-size: 0.65rem;
            color: #475569;
            margin-left: 4px;
        }

        .dash {
            width: 100%;
            max-width: 1220px;
            /* reduz todo o conteúdo do painel (textos, ícones, espaçamentos) em 18% */
            zoom: 0.82;
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2.4vh, 24px);
            min-height: 0;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid var(--borda);
            box-shadow: var(--sombra-card);
        }

        /* --- LINHA 1: CONTROLE DO ROBÔ + AÇÕES --- */
        .row-top {
            display: flex;
            align-items: center;
            gap: clamp(14px, 2vw, 36px);
        }

        .card-controle {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: clamp(14px, 1.6vw, 26px);
            padding: clamp(12px, 2vh, 20px) clamp(16px, 1.8vw, 30px);
        }

        .play-halo {
            flex-shrink: 0;
            width: clamp(74px, 6.6vw, 110px);
            height: clamp(74px, 6.6vw, 110px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 81, 30, 0.16) 0%, rgba(244, 81, 30, 0.07) 55%, rgba(244, 81, 30, 0) 72%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controle-play-circle {
            width: 76%;
            height: 76%;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #ff6a2b 0%, var(--laranja-escuro) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 1.7vw, 1.9rem);
            box-shadow: 0 8px 20px rgba(244, 81, 30, 0.4);
            cursor: pointer;
            transition: all 0.25s ease;
            outline: none;
        }

        .controle-play-circle:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 24px rgba(244, 81, 30, 0.55);
        }

        .controle-play-circle:active {
            transform: scale(0.96);
        }

        .controle-play-circle:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .controle-play-circle:focus-visible {
            outline: 3px solid rgba(244, 81, 30, 0.35);
            outline-offset: 3px;
        }

        .controle-play-circle.ativo {
            background: linear-gradient(145deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.45);
        }

        .controle-play-circle i {
            margin-left: 4px;
        }

        .controle-play-circle.ativo i {
            margin-left: 0;
        }

        .controle-divider-orange {
            width: 1.5px;
            align-self: stretch;
            margin: 6px 0;
            background: var(--laranja);
            opacity: 0.55;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* texto encostado à direita do card, ao lado do botão de play */
        .controle-info {
            min-width: 0;
            margin-left: auto;
            text-align: right;
        }

        .controle-info h2 {
            font-size: clamp(1.1rem, 1.3vw, 1.4rem);
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .controle-info p {
            font-size: clamp(0.8rem, 0.9vw, 0.98rem);
            color: #475569;
            line-height: 1.4;
            margin-bottom: 8px;
            max-width: 330px;
        }

        .controle-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(0.78rem, 0.86vw, 0.94rem);
            font-weight: 500;
            color: var(--laranja);
        }

        .controle-hint.rodando {
            color: var(--verde);
        }

        .controle-right {
            flex-shrink: 0;
            min-width: clamp(120px, 9vw, 160px);
            padding-right: clamp(0px, 0.6vw, 10px);
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.88rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 4px;
        }

        .status-dot-lg {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--verde);
            display: inline-block;
        }

        .status-dot-lg.running {
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
            animation: pulse-green 1.5s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.75; }
        }

        .status-line {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            color: var(--verde);
        }

        .status-text-val {
            font-size: clamp(1.25rem, 1.6vw, 1.75rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .signal-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 3px;
            height: 24px;
            padding-bottom: 3px;
        }

        .signal-bars span {
            width: 4px;
            border-radius: 1px;
            background: currentColor;
        }

        .signal-bars span:nth-child(1) { height: 30%; }
        .signal-bars span:nth-child(2) { height: 52%; }
        .signal-bars span:nth-child(3) { height: 76%; }
        .signal-bars span:nth-child(4) { height: 100%; }

        .acoes {
            display: flex;
            align-items: center;
            margin-left: auto;
            gap: 16px;
            flex-shrink: 0;
        }

        .btn-acao {
            height: 50px;
            padding: 0 16px;
            border-radius: 14px;
            background: #ffffff;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s ease;
        }

        .btn-acao:active {
            transform: translateY(1px);
        }

        .btn-imprimir {
            border: 1.5px solid #1e293b;
            color: var(--tinta);
            font-size: 0.72rem;
        }

        .btn-imprimir i:first-child {
            font-size: 1.25rem;
        }

        .btn-imprimir i:last-child {
            font-size: 0.6rem;
            margin-left: 4px;
        }

        .btn-imprimir:hover {
            background: var(--tinta);
            color: #ffffff;
        }

        .btn-atualizar {
            border: 1.5px solid var(--laranja);
            color: var(--laranja);
            font-size: 0.78rem;
        }

        .btn-atualizar i {
            font-size: 1.2rem;
            transition: transform 0.6s ease;
        }

        .btn-atualizar:hover {
            background: #fff4ef;
        }

        .btn-atualizar.girando i {
            transform: rotate(360deg);
        }

        /* --- LINHA 2: KPIs --- */
        .row-kpis {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(12px, 1.3vw, 24px);
        }

        .kpi {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            gap: clamp(12px, 1.3vw, 22px);
            padding: clamp(14px, 2.6vh, 24px) clamp(14px, 1.4vw, 24px);
            min-height: clamp(104px, 16.5vh, 142px);
        }

        .kpi-icon {
            flex-shrink: 0;
            width: clamp(46px, 3.7vw, 68px);
            height: clamp(46px, 3.7vw, 68px);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.3rem, 1.8vw, 2rem);
        }

        .kpi-laranja .kpi-icon { background: #ffeadc; color: var(--laranja); box-shadow: 0 6px 14px rgba(244, 81, 30, 0.14); }
        .kpi-azul .kpi-icon    { background: #dbeafe; color: #2563eb; box-shadow: 0 6px 14px rgba(37, 99, 235, 0.14); }
        .kpi-verde .kpi-icon   { background: #dcfce7; color: var(--verde); box-shadow: 0 6px 14px rgba(22, 163, 74, 0.14); }

        .kpi-body {
            position: relative;
            z-index: 1;
        }

        .kpi-num {
            font-size: clamp(1.7rem, 2.2vw, 2.4rem);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.05;
        }

        .kpi-label {
            font-size: clamp(0.82rem, 0.95vw, 1.02rem);
            color: #475569;
            margin-top: 6px;
        }

        .kpi-trend {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: clamp(8px, 1.6vh, 14px);
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--verde);
        }

        .kpi-trend i {
            font-size: 0.72rem;
        }

        .kpi-spark {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 34%;
            height: 78%;
            pointer-events: none;
        }

        /* --- LINHA 3: ÚLTIMAS EXTRAÇÕES + ROBÔ --- */
        .row-bottom {
            display: grid;
            /* card do robô pequeno, à direita, logo abaixo do play */
            grid-template-columns: minmax(0, 440px);
            justify-content: end;
            gap: clamp(12px, 1.3vw, 24px);
            min-height: 0;
        }

        .card-log {
            padding: clamp(12px, 2vh, 18px) clamp(14px, 1.4vw, 22px) clamp(10px, 1.6vh, 16px);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(8px, 1.6vh, 14px);
        }

        .card-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header-title i {
            font-size: 1.15rem;
            color: var(--laranja);
        }

        .card-header-title h2 {
            font-size: clamp(1.05rem, 1.2vw, 1.3rem);
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .btn-ver-todas {
            background: transparent;
            border: none;
            color: var(--laranja);
            font-size: 0.95rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .btn-ver-todas:hover {
            background: #fff4ef;
        }

        .log-scroll {
            min-height: 0;
            /* cabeçalho + ~4 linhas; entradas mais antigas rolam dentro do card */
            max-height: 232px;
            overflow-y: auto;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.82rem, 0.92vw, 1rem);
        }

        .log-table thead th {
            position: sticky;
            top: 0;
            background: #f5f6f8;
            text-align: left;
            font-weight: 500;
            color: #1e293b;
            padding: clamp(6px, 1.1vh, 10px) 14px;
        }

        .log-table thead th:first-child { border-radius: 6px 0 0 6px; }
        .log-table thead th:last-child  { border-radius: 0 6px 6px 0; }

        .log-table tbody td {
            padding: clamp(6px, 1.15vh, 10px) 14px;
            border-bottom: 1px solid #edf0f4;
        }

        .log-table tbody tr:last-child td {
            border-bottom: none;
        }

        .log-table .col-hora {
            width: 22%;
            color: #334155;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .log-table .col-desc {
            font-weight: 500;
        }

        .log-table .col-status {
            width: 130px;
        }


        .pill-ok {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: #dcfce7;
            color: #15803d;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 3px 12px 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .pill-ok::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--verde);
        }

        .card-robo {
            position: relative;
            overflow: hidden;
            border: 1px solid #fde3d3;
            background: linear-gradient(135deg, #fff1e7 0%, #ffe9db 55%, #ffe1cf 100%);
            display: flex;
            align-items: center;
            gap: clamp(8px, 1vw, 18px);
            padding: clamp(14px, 2vh, 22px) clamp(14px, 1.3vw, 22px);
        }

        .robo-swoosh {
            position: absolute;
            inset: auto 0 0 0;
            width: 100%;
            height: 55%;
            pointer-events: none;
        }

        .robo-dot {
            position: absolute;
            top: 22px;
            right: 22px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
        }

        .robo-dot::after {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #94a3b8;
            transition: background 0.3s ease;
        }

        .card-robo.operando .robo-dot::after {
            background: var(--verde);
        }

        .robo-svg {
            position: relative;
            flex-shrink: 0;
            width: clamp(84px, 8.5vw, 150px);
            height: auto;
            filter: drop-shadow(0 10px 14px rgba(244, 81, 30, 0.18));
        }

        .card-robo.operando .robo-svg {
            animation: flutuar 2.6s ease-in-out infinite;
        }

        @keyframes flutuar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .robo-texto {
            position: relative;
            min-width: 0;
        }

        .robo-texto h3 {
            font-size: clamp(1.1rem, 1.45vw, 1.6rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .robo-texto p {
            font-size: clamp(0.8rem, 0.88vw, 0.95rem);
            color: #475569;
            line-height: 1.5;
        }

        @media (prefers-reduced-motion: reduce) {
            .status-dot-lg.running,
            .card-robo.operando .robo-svg {
                animation: none;
            }
        }

        /* Telas médias: botões de ação descem para baixo do card de controle */
        @media (max-width: 1500px) {
            .row-top {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .acoes {
                justify-content: flex-end;
            }
            .btn-acao {
                height: 40px;
            }
            .kpi-spark {
                opacity: 0.55;
            }
        }

        /* Responsividade */
        @media (max-width: 1100px) {
            html, body {
                height: auto;
                max-height: none;
                overflow-y: auto;
            }
            .page-container {
                flex-direction: column;
                height: auto;
                max-height: none;
                overflow: visible;
            }
            .left-pane {
                flex: none;
                width: 100%;
                max-width: 100%;
                min-width: 0;
                height: 380px;
            }
            .right-pane {
                height: auto;
                max-height: none;
                padding: 24px 16px 36px;
                overflow: visible;
            }
            .top-header-bar {
                position: static;
                align-self: flex-end;
                margin-bottom: 12px;
            }
            .row-kpis,
            .row-bottom {
                grid-template-columns: 1fr;
            }
            .card-controle {
                flex-wrap: wrap;
            }
            .acoes {
                flex-wrap: wrap;
            }
            .floating-navbar {
                width: 92%;
                max-width: 520px;
                overflow-x: auto;
                justify-content: flex-start;
            }
        }
    </style>
</head>

    <div class="page-container">

        <!-- LADO ESQUERDO: PAINEL INDUSTRIAL ARCELORMITTAL COM ONDAS E CURVA ORGÂNICA -->
        <aside class="left-pane" aria-label="Painel Informativo ArcelorMittal">
            <img src="img/arcelormittal-panel.png" alt="ArcelorMittal Robô de Licitações" class="left-panel-img">
        </aside>

        <!-- LADO DIREITO: PAINEL DE OPERAÇÃO -->
        <main class="right-pane">

            <div class="top-header-bar">
                <div class="lang-selector" title="Selecionar Idioma">
                    <i class="fa-solid fa-globe"></i>
                    <span>Português (pt-BR)</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
            </div>

            <div class="dash">

                <!-- LINHA 1: PLAY + ATUALIZAR -->
                <div class="row-top">
                    <div class="acoes">
                        <div class="play-halo">
                            <button class="controle-play-circle" id="btn-play-circle" onclick="alternarRobo()" title="Clique para Iniciar ou Pausar o Robô" aria-label="Iniciar ou pausar o robô">
                                <i class="fa-solid fa-play" id="btn-icon"></i>
                            </button>
                        </div>
                        <button class="btn-acao btn-atualizar" id="btn-atualizar" onclick="atualizarCotacoes()" title="Atualizar status do robô">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Atualizar</span>
                        </button>
                    </div>
                </div>

                <!-- LINHA 2: STATUS DO ROBÔ -->
                <div class="row-bottom">
                    <section class="card card-robo" id="card-robo">
                        <svg class="robo-swoosh" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true">
                            <path d="M150,120 C220,112 270,90 300,58 L300,120 Z" fill="#f4511e"/>
                            <path d="M90,120 C180,116 250,96 300,66 L300,74 C250,104 190,118 120,120 Z" fill="#ff8a5c" opacity="0.7"/>
                        </svg>
                        <span class="robo-dot" aria-hidden="true"></span>

                        <svg class="robo-svg" viewBox="0 0 140 160" aria-hidden="true">
                            <defs>
                                <linearGradient id="robo-corpo" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#ffffff"/>
                                    <stop offset="1" stop-color="#e8ebf0"/>
                                </linearGradient>
                            </defs>
                            <!-- antena -->
                            <rect x="68" y="14" width="4" height="18" rx="2" fill="#cbd5e1"/>
                            <circle cx="70" cy="11" r="7" fill="#f4511e"/>
                            <!-- orelhas -->
                            <rect x="8" y="58" width="14" height="30" rx="7" fill="#f4511e"/>
                            <rect x="118" y="58" width="14" height="30" rx="7" fill="#f4511e"/>
                            <!-- corpo -->
                            <path d="M38,112 C38,104 52,100 70,100 C88,100 102,104 102,112 L108,150 C108,156 92,160 70,160 C48,160 32,156 32,150 Z" fill="url(#robo-corpo)"/>
                            <!-- cabeça -->
                            <rect x="16" y="30" width="108" height="84" rx="38" fill="url(#robo-corpo)"/>

                            <rect x="30" y="52" width="80" height="42" rx="21" fill="#141a2e"/>

                        <div class="robo-texto">

                </div>

            </div>

    </div>

    <script>
        const socket = io({
            auth: { sessionId: localStorage.getItem('maestro_session') },
            transports: ['websocket'],
            upgrade: false
        });

        // desligado | iniciando | ligado (vem do gerenciador, que checa o "dotnet run" do ArcelorMittal)
        let estadoRobo = 'desligado';

        const SUB_PADRAO = {
            desligado: 'Clique no play para buscar novas oportunidades.',
            iniciando: 'Abrindo o robô no servidor...',
            ligado: 'Buscando novas oportunidades para você.'
        };

        socket.on('connect', () => {
            socket.emit('sou_frontend', { usuario: localStorage.getItem('maestro_user') || 'Usuário' });
            socket.emit('pedir_estado_arcelormittal');
        });

        socket.on('disconnect', () => mostrarMensagem('Conexão com o servidor perdida. Reconectando...'));

        socket.on('sessao_invalida', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });

        socket.on('sincronizar_estado_arcelormittal', (dados) => {
            document.getElementById('btn-atualizar').classList.remove('girando');
            aplicarEstado((dados && dados.status) || 'desligado');
        });

        // Sem tela de log: a última mensagem do gerenciador aparece no card do robô
        socket.on('relatar_progresso_arcelormittal', (dados) => {
            if (dados && dados.mensagem) mostrarMensagem(dados.mensagem);
        });

        function mostrarMensagem(msg) {
            document.getElementById('robo-sub').textContent = msg;
        }

        function aplicarEstado(status) {
            const mudou = status !== estadoRobo;
            estadoRobo = status;
            const ativo = status === 'ligado' || status === 'iniciando';
            const btnPlay = document.getElementById('btn-play-circle');

            btnPlay.disabled = false;
            btnPlay.classList.toggle('ativo', ativo);
            btnPlay.title = ativo ? 'Desligar o Robô' : 'Ligar o Robô';
            btnPlay.setAttribute('aria-label', btnPlay.title);
            document.getElementById('btn-icon').className = ativo ? 'fa-solid fa-stop' : 'fa-solid fa-play';

            document.getElementById('card-robo').classList.toggle('operando', status === 'ligado');
            document.getElementById('robo-titulo').textContent =
                status === 'ligado' ? 'Robô em operação' : status === 'iniciando' ? 'Robô iniciando' : 'Robô em espera';
            if (mudou) mostrarMensagem(SUB_PADRAO[status] || SUB_PADRAO.desligado);
        }

        function alternarRobo() {
            const ligar = !(estadoRobo === 'ligado' || estadoRobo === 'iniciando');
            if (!ligar && !confirm('Deseja realmente desligar o robô ArcelorMittal?')) return;
            const btnPlay = document.getElementById('btn-play-circle');
            btnPlay.disabled = true;
            socket.emit('comando_direto', { modo: ligar ? 'ligar_robo' : 'desligar_robo', portal: 'arcelormittal' });
            mostrarMensagem(ligar ? 'Pedido para ligar o robô enviado ao gerenciador.' : 'Pedido para desligar o robô enviado ao gerenciador.');
            // Sem resposta do gerenciador em 15 s, libera o botão de novo
            setTimeout(() => { btnPlay.disabled = false; }, 15000);
        }

        // Atualizar: pergunta de novo ao gerenciador se o robô está rodando
        function atualizarCotacoes() {
            const btn = document.getElementById('btn-atualizar');
            btn.classList.add('girando');
            socket.emit('pedir_estado_arcelormittal');
            setTimeout(() => btn.classList.remove('girando'), 600);
        }

        function irPara(url) {
            window.location.href = url;
        }
    </script>

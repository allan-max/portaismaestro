<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Controle de Acessos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      color: #e4e4e7;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    header p {
      color: #a1a1aa;
      font-size: 14px;
    }

    .card {
      background: rgba(30, 30, 50, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    td {
      font-size: 14px;
      color: #e4e4e7;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.08);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-badge.online {
      background: rgba(52, 211, 153, 0.2);
      color: #34d399;
    }

    .status-badge.offline {
      background: rgba(248, 113, 113, 0.2);
      color: #f87171;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.online { background-color: #34d399; }
    .status-dot.offline { background-color: #f87171; }

    /* Estilo para o Toggle (Checkbox como botão liga/desliga) */
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.2);
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #818cf8;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="display: flex; align-items: center; gap: 16px;">
        <button onclick="window.location.href='index.html'" style="background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'" title="Voltar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
          </svg>
        </button>
        <div>
          <h1>Painel de Controle Admin</h1>
          <p>Gerencie o acesso à Estatística (Dashboard) e monitore usuários</p>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button onclick="carregarUsuarios()" style="background: #34d399; color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s;">
          🔄 Atualizar Lista
        </button>
        <button onclick="abrirConfiguracoes()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
          ⚙️ CONFIGURAÇÕES
        </button>
      </div>
    </header>

    <!-- MODAL CONFIGURACOES -->
    <div id="modal-config" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15, 12, 41, 0.95); z-index:9999; justify-content:center; align-items:center; backdrop-filter:blur(10px);">
      <div style="background: rgba(30, 30, 50, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 30px; max-width: 600px; width: 90%; text-align:left;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="color: #fff;">⚙️ Variáveis do Robô (CONFIG.json)</h2>
          <button onclick="document.getElementById('modal-config').style.display='none'" style="background:transparent; border:none; color:#f87171; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="config-form" style="max-height: 60vh; overflow-y: auto; padding-right: 10px;">
          <!-- Inputs generated dynamically -->
        </div>
        <button onclick="salvarConfiguracoes()" style="margin-top:20px; width:100%; background:#34d399; color:#000; border:none; padding:15px; border-radius:8px; font-weight:bold; cursor:pointer;">💾 SALVAR CONFIGURAÇÕES NO ROBÔ</button>
      </div>
    </div>

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 18px;">Contas e Permissões</h2>
        <input type="text" id="pesquisaUsuario" placeholder="🔍 Buscar usuário..." oninput="filtrarUsuarios()" style="background: rgba(15,15,26,0.8); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 12px; border-radius: 6px; outline: none; width: 100%; max-width: 300px;">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Usuário (E-mail)</th>
              <th>Status</th>
              <th>Último Login</th>
              <th>Localização (IP)</th>
              <th>Acesso Estatística</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align:center; padding: 20px;">Carregando dados...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
  <script>
    // 🔒 BARREIRA DE SEGURANÇA: Só entra quem for Admin!
    if (localStorage.getItem('maestro_admin') !== 'true') {
        window.location.href = 'index.html';
    }

    const sessionAtual = localStorage.getItem('maestro_session');
    const socket = io({ 
        auth: { sessionId: sessionAtual },
        transports: ['websocket'],
        upgrade: false
    });

    socket.on("connect_error", (err) => {
        console.error("Conexão recusada:", err.message);
        window.location.href = "index.html"; 
    });

    let todosUsuarios = [];

    window.onload = () => carregarUsuarios();

    function carregarUsuarios() {
        socket.emit('admin_pedir_usuarios');
    }

    socket.on('admin_receber_usuarios', (usuariosJson) => {
        // Converte o objeto em um array
        todosUsuarios = Object.entries(usuariosJson).map(([email, dados]) => {
            return { email, ...dados };
        });
        renderizarTabela(todosUsuarios);
    });

    function renderizarTabela(lista) {
        const tbody = document.getElementById("usersTableBody");
        if (lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: #a1a1aa;">Nenhum usuário encontrado.</td></tr>';
            return;
        }

        let html = '';
        lista.forEach(user => {
            const statusClass = user.online ? 'online' : 'offline';
            const statusText = user.online ? 'Ativo' : 'Inativo';
            const hasAccess = user.dashboard_access || user.admin; // Admin sempre tem acesso!
            const disabledAttr = user.admin ? 'disabled title="Administradores sempre têm acesso"' : '';
            
            html += `
              <tr>
                <td><strong>${user.email}</strong> ${user.admin ? '<span style="color:#fbbf24; font-size:11px; margin-left:6px;">[ADMIN]</span>' : ''}</td>
                <td>
                  <div class="status-badge ${statusClass}">
                    <div class="status-dot ${statusClass}"></div> ${statusText}
                  </div>
                </td>
                <td style="color: #a1a1aa;">${user.ultimo_login || 'Nunca'}</td>
                <td style="color: #a1a1aa; font-size: 12px; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${user.ultima_localizacao || 'Desconhecida'}">${user.ultima_localizacao || 'Desconhecida'}</td>
                <td>
                  <label class="toggle-switch">
                    <input type="checkbox" onchange="toggleAccess('${user.email}', this.checked)" ${hasAccess ? 'checked' : ''} ${disabledAttr}>
                    <span class="slider"></span>
                  </label>
                </td>
              </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function filtrarUsuarios() {
        const termo = document.getElementById('pesquisaUsuario').value.toLowerCase();
        const listaFiltrada = todosUsuarios.filter(u => u.email.toLowerCase().includes(termo));
        renderizarTabela(listaFiltrada);
    }

    function toggleAccess(email, isAllowed) {
        socket.emit('admin_alterar_acesso_dashboard', { email: email, acesso: isAllowed });
    }

    socket.on('admin_acesso_alterado', (dados) => {
        if (dados.sucesso) {
            // Atualiza localmente para refletir no cache
            const u = todosUsuarios.find(u => u.email === dados.email);
            if(u) u.dashboard_access = dados.acesso;
        } else {
            alert("Erro ao alterar acesso: " + dados.erro);
            carregarUsuarios(); // recarrega a tabela p/ voltar o estado real
        }
    });

    // ====================================================
    // CONFIGURAÇÕES DO ROBÔ
    // ====================================================
    function abrirConfiguracoes() {
        socket.emit('pedir_config_admin');
    }

    socket.on('receber_config_admin', (dados) => {
        let config = dados.config || dados;
        if (dados && dados.config) config = dados.config;
        
        if (dados.sucesso) {
            alert("Configurações atualizadas no robô local com sucesso!");
            document.getElementById('modal-config').style.display = 'none';
            return;
        }

        const form = document.getElementById('config-form');
        form.innerHTML = '';
        for (let key in config) {
            let div = document.createElement('div');
            div.style.marginBottom = "15px";
            let label = document.createElement('label');
            label.style.color = "#a1a1aa";
            label.style.fontSize = "12px";
            label.style.display = "block";
            label.style.marginBottom = "5px";
            label.innerText = key;
            let input = document.createElement('input');
            input.style.width = "100%";
            input.style.padding = "10px";
            input.style.background = "rgba(0,0,0,0.5)";
            input.style.border = "1px solid rgba(255,255,255,0.2)";
            input.style.color = "#fff";
            input.style.borderRadius = "6px";
            input.style.fontFamily = "monospace";
            input.id = "config_" + key;
            input.value = config[key];
            
            div.appendChild(label);
            div.appendChild(input);
            form.appendChild(div);
        }
        document.getElementById('modal-config').style.display = 'flex';
    });

    function salvarConfiguracoes() {
        if(!confirm("Certeza que deseja alterar as variáveis do robô? Ele usará os novos caminhos imediatamente.")) return;
        
        let form = document.getElementById('config-form');
        let inputs = form.getElementsByTagName('input');
        let nova_config = {};
        for (let i = 0; i < inputs.length; i++) {
            let key = inputs[i].id.replace('config_', '');
            nova_config[key] = inputs[i].value;
        }
        socket.emit('salvar_config_admin', { config: nova_config });
    }

  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MAESTRO | Minhas Cotações</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="dashboard-cotacoes/style.css">
    <link rel="stylesheet" href="dashboard-comum/comum.css">
    <link rel="stylesheet" href="minhas-cotacoes/tela.css">
</head>
<body>
    <div id="topo"></div>
    <main id="main" class="dash-main"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script>
        if (typeof JSZip === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"><\/script>');
        }
    </script>
    <script src="vendor/exceljs-4.4.0.min.js"></script>
    <script src="vendor/template_planilha_base.js"></script>
    <script>
        // Dados (socket) e exportações. A tela em si fica em minhas-cotacoes/tela.js.
        const sessionAtual = localStorage.getItem('maestro_session');
        const vendedorLogado = (localStorage.getItem('maestro_vendedor') || '').trim();

        if (!sessionAtual) {
            window.location.href = 'index.html';
        }

        const isAdmin = localStorage.getItem('maestro_admin') === 'true';
        const temAcessoPlanilha = isAdmin || localStorage.getItem('maestro_planilha') === 'true';
        const temAcessoPortais = isAdmin || localStorage.getItem('maestro_portais') === 'true';

        const socket = io({ auth: { sessionId: sessionAtual }, transports: ['websocket'], upgrade: false });

        socket.emit('sou_frontend', { sessionId: sessionAtual, usuario: localStorage.getItem('maestro_user') });

        socket.on('sessao_invalida', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });

        socket.on('planilha_atualizada', () => carregarMinhasCotacoes());
        socket.on('connect', () => window.Tela && window.Tela.conexao(true));
        socket.on('disconnect', () => window.Tela && window.Tela.conexao(false));

        let todasCotacoes = [];
        let cotacoesFiltradas = [];
        window.todasCotacoes = todasCotacoes;
        window.cotacoesFiltradas = cotacoesFiltradas;

        function carregarMinhasCotacoes() {
            socket.emit('solicitar_planilha_json', { origem: 'todas', apenas_meu_vendedor: true });
        }

        function isRespondida(c) {
            const resp = String(c['RESPOSTA'] || '').trim().toUpperCase();
            return (resp.includes('RESPONDID')) && !resp.includes('NÃO') && !resp.includes('NAO');
        }

        function parseDataVenc(valor) {
            if (!valor) return null;
            const str = String(valor).trim();

            const isoMatch = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (isoMatch) {
                const yr = Number(isoMatch[1]), m = Number(isoMatch[2]), d = Number(isoMatch[3]);
                const dt = new Date(yr, m - 1, d);
                dt.setHours(0, 0, 0, 0);
                if (dt.getFullYear() !== yr || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
                return dt.getTime();
            }

            const match = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (!match) return null;
            const p1 = Number(match[1]), p2 = Number(match[2]), yr = Number(match[3]);
            const d = p2 > 12 ? p2 : p1;
            const m = p2 > 12 ? p1 : p2;
            const dt = new Date(yr, m - 1, d);
            dt.setHours(0, 0, 0, 0);
            if (dt.getFullYear() !== yr || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
            return dt.getTime();
        }

        function getHojeMeiaNoite() {
            const h = new Date();
            h.setHours(0, 0, 0, 0);
            return h.getTime();
        }

        function calcularPrioridadeVencimento(c) {
            const tVenc = parseDataVenc(c['VENCIMENTO']);
            if (tVenc === null) return { grupo: 4, ordem: Infinity, diffDias: null };

            const hoje = getHojeMeiaNoite();
            const umDia = 24 * 60 * 60 * 1000;
            const diffDias = Math.round((tVenc - hoje) / umDia);

            if (diffDias === 0) {
                return { grupo: 1, ordem: 0, diffDias };
            } else if (diffDias > 0 && diffDias <= 7) {
                return { grupo: 2, ordem: tVenc, diffDias };
            } else {
                return { grupo: 3, ordem: tVenc, diffDias };
            }
        }

        // vencidas ficam de fora: a tela mostra só o que ainda dá para responder
        socket.on('retorno_planilha_json', (res) => {
            if (!res.sucesso) {
                if (window.Tela) window.Tela.falhou(res.erro);
                return;
            }

            const hoje = getHojeMeiaNoite();
            todasCotacoes = (res.cotacoes || []).filter(c => {
                const tVenc = parseDataVenc(c['VENCIMENTO']);
                return tVenc !== null && tVenc >= hoje;
            });
            window.todasCotacoes = todasCotacoes;
            if (window.Tela) window.Tela.receber(todasCotacoes);
        });

        function marcarComoRespondida(c) {
            const identidade = {
                'COTAÇÃO': String(c['COTAÇÃO'] ?? ''),
                'VENDEDOR': String(c['VENDEDOR'] ?? ''),
                'LOCALIDADE': String(c['LOCALIDADE'] ?? ''),
                'ITEM': String(c['ITEM'] ?? ''),
                'VENCIMENTO': String(c['VENCIMENTO'] ?? '')
            };
            socket.emit('marcar_cotacao_respondida', { identidade });
        }

        // sucesso ou erro, recarrega: a tela marcou como respondida antes da confirmação do servidor
        socket.on('resposta_acao_linha', (res) => {
            if (!res.sucesso && window.Tela) {
                window.Tela.toast('Não foi possível marcar como respondida: ' + String(res.erro || 'erro desconhecido').replace(/[&<>"']/g, ''));
            }
            carregarMinhasCotacoes();
        });

        function extrairQuantidadeNumero(val) {
            if (typeof val === 'number') {
                return isNaN(val) || val <= 0 ? 1 : val;
            }
            if (!val) return 1;
            let s = String(val).trim();
            // Remove prefixos de índice de item como '(Item 1)', 'Item 1 -', 'ITEM 2:' no início
            s = s.replace(/^(?:\(\s*Item\s*\d+\s*\)|Item\s*\d+)\s*[:.\-–—]?\s*/i, '').trim();
            if (/\d+\.\d+,\d+/.test(s)) {
                s = s.replace(/\./g, '').replace(',', '.');
            } else if (/\d+,\d+/.test(s)) {
                s = s.replace(',', '.');
            } else if (/\d+\.\d{3}/.test(s) && !/\./.test(s.slice(s.indexOf('.') + 4))) {
                s = s.replace(/\./g, '');
            }
            const m = s.match(/-?\d+(?:\.\d+)?/);
            if (m) {
                const num = parseFloat(m[0]);
                return (!isNaN(num) && num > 0) ? num : 1;
            }
            return 1;
        }

        function extrairListaQuantidades(val) {
            if (val === undefined || val === null || val === '') return [];
            if (typeof val === 'number') {
                return (!isNaN(val) && val > 0) ? [val] : [];
            }
            const s = String(val).trim();
            if (!s) return [];

            let partes = s.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            if (partes.length <= 1) {
                if (/(?:^|\s)\(\s*Item\s*\d+\s*\)/i.test(s)) {
                    const splitItem = s.split(/(?=\(\s*Item\s*\d+\s*\))/i).map(l => l.trim()).filter(Boolean);
                    if (splitItem.length > 1) partes = splitItem;
                } else if (/(?:^|\s)Item\s*\d+\s*[:.\-–—]/i.test(s)) {
                    const splitItem = s.split(/(?=(?:^|\s)Item\s*\d+\s*[:.\-–—])/i).map(l => l.trim()).filter(Boolean);
                    if (splitItem.length > 1) partes = splitItem;
                } else if (s.includes(';')) {
                    const splitSemi = s.split(';').map(l => l.trim()).filter(Boolean);
                    if (splitSemi.length > 1) partes = splitSemi;
                }
            }

            return partes.map(p => extrairQuantidadeNumero(p));
        }

        function extrairValorPorItem(textoBruto) {
            if (!textoBruto) return [];
            const s = String(textoBruto).trim();
            if (!s) return [];
            let linhas = s.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            if (linhas.length <= 1 && /(?:^|\s)\(\s*Item\s*\d+\s*\)/i.test(s)) {
                const partes = s.split(/(?=\(\s*Item\s*\d+\s*\))/i).map(l => l.trim()).filter(Boolean);
                if (partes.length > 1) linhas = partes;
            }
            return linhas.map(l => l.replace(/^(?:\(\s*Item\s*\d+\s*\)|Item\s*\d+)\s*[:.\-–—]?\s*/i, '').trim()).filter(Boolean);
        }

        function extrairLinhasItens(textoBruto) {
            if (!textoBruto) return [];
            let s = String(textoBruto).trim();
            if (!s) return [];

            let linhas = s.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

            if (linhas.length <= 1) {
                if (s.includes('•')) {
                    linhas = s.split('•').map(l => l.trim()).filter(Boolean);
                } else if (/(?:^|\s)\(\s*Item\s*\d+\s*\)/i.test(s)) {
                    const partes = s.split(/(?=\(\s*Item\s*\d+\s*\))/i).map(l => l.trim()).filter(Boolean);
                    if (partes.length > 1) linhas = partes;
                } else if (/(?:^|\s)Item\s*\d+\s*[:.\-–—]/i.test(s)) {
                    const partes = s.split(/(?=(?:^|\s)Item\s*\d+\s*[:.\-–—])/i).map(l => l.trim()).filter(Boolean);
                    if (partes.length > 1) linhas = partes;
                }
            }
            return linhas;
        }

        function parseLinhaItem(linhaStr, fallbackQtd = 1, opcoes = {}) {
            let s = String(linhaStr || '').trim();
            if (!s) return null;

            const ignorarQtdInline = Boolean(opcoes && opcoes.ignorarQtdInline);
            const codigosModelo = Array.isArray(opcoes && opcoes.codigosModelo)
                ? opcoes.codigosModelo.map(c => String(c || '').trim()).filter(Boolean)
                : [];

            s = s.replace(/^[•\-\*\s]+/, '').trim();
            // Remove '(Item 1)', 'Item 1 -', 'ITEM 2:', ou índice numérico simples '1 -' / '1.' no início da linha
            s = s.replace(/^(?:\(\s*Item\s*\d+\s*\)|Item\s*\d+)\s*[:.\-–—]?\s*/i, '').trim();
            s = s.replace(/^\d{1,3}\s*[:.\-–—]\s*/, '').trim();

            let qtd = null;
            let produto = s;

            if (!ignorarQtdInline) {
                // Exige unidade explícita no início (un, und, unid, pc, pç, ea, cx, etc.) para não confundir códigos de modelo/material (ex: 13091680 || MOUSE) com quantidade
                const mQtdInicio = s.match(/^(\d+(?:\.\d{3})*(?:[.,]\d+)?)\s*(?:unid\.?|unidades?|und\.?|un\b|pcs?\b|pçs?\b|peças?\b|pecas?\b|ea\b|cx\b|caixas?\b|rolos?\b|kit\b|pares?\b|par\b|mt\b|metros?\b|kg\b|g\b|lt?\b|litros?\b|x\b)(?:-[a-zA-ZÀ-ÿ]+)?\s*[:.\-–—]?\s*/i);

                if (mQtdInicio && mQtdInicio[0].length < s.length) {
                    let qStr = mQtdInicio[1].trim();
                    if (!codigosModelo.includes(qStr)) {
                        if (/^\d+\.\d{3}$/.test(qStr)) qStr = qStr.replace(/\./g, '');
                        else if (/\d+\.\d+,\d+/.test(qStr)) qStr = qStr.replace(/\./g, '').replace(',', '.');
                        else if (/\d+,\d+/.test(qStr)) qStr = qStr.replace(',', '.');
                        const num = parseFloat(qStr);
                        if (!isNaN(num) && num > 0) {
                            qtd = num;
                            produto = s.slice(mQtdInicio[0].length).trim();
                        }
                    }
                }

                if (qtd === null) {
                    // Captura quantidade no final apenas se houver parênteses com unidade/qtd, prefixo qtd/quantidade ou unidade explícita
                    const mQtdFim = s.match(/(?:[\(\[]\s*(?:(?:qtd|quantidade)\s*[:.\-–—]?\s*)(\d+(?:\.\d{3})*(?:[.,]\d+)?)\s*(?:unid\.?|unidades?|und\.?|un\b|pcs?\b|pçs?\b|peças?\b|pecas?\b|ea\b|cx\b|caixas?\b|rolos?\b|kit\b|pares?\b|par\b|mt\b|metros?\b|kg\b|g\b|lt?\b|litros?\b)?\s*[\)\]]|[\(\[]\s*(\d+(?:\.\d{3})*(?:[.,]\d+)?)\s*(?:unid\.?|unidades?|und\.?|un\b|pcs?\b|pçs?\b|peças?\b|pecas?\b|ea\b|cx\b|caixas?\b|rolos?\b|kit\b|pares?\b|par\b|mt\b|metros?\b|kg\b|g\b|lt?\b|litros?\b)\s*[\)\]]|(?:(?:qtd|quantidade)\s*[:.\-–—]?\s*)(\d+(?:\.\d{3})*(?:[.,]\d+)?)\s*(?:unid\.?|unidades?|und\.?|un\b|pcs?\b|pçs?\b|peças?\b|pecas?\b|ea\b|cx\b|caixas?\b|rolos?\b|kit\b|pares?\b|par\b|mt\b|metros?\b|kg\b|g\b|lt?\b|litros?\b)?|(\d+(?:\.\d{3})*(?:[.,]\d+)?)\s*(?:unid\.?|unidades?|und\.?|un\b|pcs?\b|pçs?\b|peças?\b|pecas?\b|ea\b|cx\b|caixas?\b|rolos?\b|kit\b|pares?\b|par\b|mt\b|metros?\b|kg\b|g\b|lt?\b|litros?\b))\s*$/i);
                    if (mQtdFim && mQtdFim.index > 0) {
                        let qStr = (mQtdFim[1] || mQtdFim[2] || mQtdFim[3] || mQtdFim[4] || '').trim();
                        if (!codigosModelo.includes(qStr)) {
                            if (/^\d+\.\d{3}$/.test(qStr)) qStr = qStr.replace(/\./g, '');
                            else if (/\d+\.\d+,\d+/.test(qStr)) qStr = qStr.replace(/\./g, '').replace(',', '.');
                            else if (/\d+,\d+/.test(qStr)) qStr = qStr.replace(',', '.');
                            const num = parseFloat(qStr);
                            if (!isNaN(num) && num > 0) {
                                qtd = num;
                                produto = s.slice(0, mQtdFim.index).replace(/[-:;,]+$/, '').trim();
                            }
                        }
                    }
                }
            }

            if (qtd === null) {
                qtd = (typeof fallbackQtd === 'number' && fallbackQtd > 0) ? fallbackQtd : 1;
            }

            return {
                produto: produto || s,
                quantidade: qtd
            };
        }

        function parseItensCotacao(cota) {
            if (!cota) return [];
            const rawTexto = cota['ITEM'] || cota['ITENS'] || cota['DESCRICAO'] || cota['PRODUTO'] || '';
            const qtdGlobalRaw = cota['QUANTIDADE'] !== undefined ? cota['QUANTIDADE'] : (cota['QTD'] !== undefined ? cota['QTD'] : (cota['QUANT'] !== undefined ? cota['QUANT'] : ''));
            const modelosRaw = cota['MODELOS'] !== undefined ? cota['MODELOS'] : (cota['MODELO'] !== undefined ? cota['MODELO'] : '');

            const listaQtds = extrairListaQuantidades(qtdGlobalRaw);
            const qtdGlobal = listaQtds.length > 0 ? listaQtds[0] : extrairQuantidadeNumero(qtdGlobalRaw);
            const listaModelos = extrairValorPorItem(modelosRaw);

            const linhas = extrairLinhasItens(rawTexto);
            if (!linhas.length) {
                return [{ produto: '', quantidade: qtdGlobal || 1 }];
            }

            // Se o campo QUANTIDADE possui uma quantidade para cada linha de item (ex: '05 und.\n10 und.'), cada item recebe sua respectiva quantidade na ordem
            const temQtdPorLinha = listaQtds.length > 1;
            const itens = [];

            for (let i = 0; i < linhas.length; i++) {
                const linha = linhas[i];
                let fallbackPorItem = 1;
                if (i < listaQtds.length) {
                    fallbackPorItem = listaQtds[i];
                } else if (linhas.length === 1) {
                    fallbackPorItem = qtdGlobal;
                }

                const parsed = parseLinhaItem(linha, fallbackPorItem, {
                    ignorarQtdInline: temQtdPorLinha && i < listaQtds.length,
                    codigosModelo: listaModelos
                });
                if (parsed && parsed.produto) {
                    itens.push(parsed);
                }
            }

            if (!itens.length) {
                itens.push({ produto: rawTexto, quantidade: qtdGlobal || 1 });
            }

            return itens;
        }

        async function obterBufferPlanilhaBase() {
            const base64 = (typeof window !== 'undefined' && window.__TEMPLATE_PLANILHA_BASE_BASE64)
                ? window.__TEMPLATE_PLANILHA_BASE_BASE64
                : (typeof __TEMPLATE_PLANILHA_BASE_BASE64 !== 'undefined' ? __TEMPLATE_PLANILHA_BASE_BASE64 : null);

            if (base64) {
                const binStr = (typeof atob === 'function')
                    ? atob(base64)
                    : (typeof Buffer !== 'undefined' ? Buffer.from(base64, 'base64').toString('binary') : null);
                if (binStr) {
                    const len = binStr.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binStr.charCodeAt(i);
                    }
                    return bytes.buffer;
                }
            }

            if (typeof fetch === 'function') {
                const resp = await fetch('PLANILHA BASE.xlsx');
                if (!resp.ok) {
                    throw new Error(`Falha ao obter PLANILHA BASE.xlsx (HTTP ${resp.status})`);
                }
                return await resp.arrayBuffer();
            }

            throw new Error('Template da Planilha Base não encontrado.');
        }

        async function exportarCotacaoPlanilhaBase(cota) {
            if (!cota) {
                alert('Nenhuma cotação selecionada para exportar.');
                return;
            }

            const btn = document.getElementById('btn-exportar-planilha-base');
            if (btn) {
                btn.disabled = true;
                btn._origHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Exportando...';
            }

            try {
                if (typeof ExcelJS === 'undefined') {
                    throw new Error('Biblioteca ExcelJS não carregada.');
                }

                const bufferTemplate = await obterBufferPlanilhaBase();
                const wb = new ExcelJS.Workbook();
                await wb.xlsx.load(bufferTemplate);

                const ws = wb.getWorksheet('ORÇAMENTO') || wb.worksheets[0];
                if (!ws) {
                    throw new Error('Aba ORÇAMENTO não encontrada na Planilha Base.');
                }

                const itens = parseItensCotacao(cota);

                // Preenche cada item na sua linha correspondente: linha 2 = item 1, linha 3 = item 2, etc.
                itens.forEach((item, idx) => {
                    const rowNum = 2 + idx;

                    // Coluna A (PRODUTO)
                    ws.getCell('A' + rowNum).value = item.produto;

                    // Coluna B (QUANTIDADE)
                    ws.getCell('B' + rowNum).value = item.quantidade;

                    // Se exceder as linhas pré-configuradas do template, adiciona as fórmulas padrão
                    if (rowNum > 25) {
                        ws.getCell('H' + rowNum).value = { formula: `(C${rowNum}+(D${rowNum}/B${rowNum})+(E${rowNum}/B${rowNum})+(F${rowNum}))*B${rowNum}` };
                        ws.getCell('I' + rowNum).value = { formula: `(H${rowNum}*G${rowNum}/100)+H${rowNum}` };
                        ws.getCell('J' + rowNum).value = { formula: `I${rowNum}/B${rowNum}` };
                    }
                });

                const idCotacao = String(cota['COTAÇÃO'] || cota['COTACAO'] || cota['NUMERO'] || cota['ID'] || 'cotacao')
                    .replace(/[^a-zA-Z0-9_-]/g, '_') || 'cotacao';
                const nomeArquivo = `planilha_base_cotacao_${idCotacao}.xlsx`;

                const buffer = await wb.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                baixarBlob(blob, nomeArquivo);
            } catch (err) {
                console.error('Erro ao exportar para Planilha Base:', err);
                alert('Não foi possível exportar para a Planilha Base: ' + (err.message || 'Erro desconhecido'));
            } finally {
                if (btn) {
                    btn.disabled = false;
                    if (btn._origHtml) btn.innerHTML = btn._origHtml;
                }
            }
        }

        function escaparXml(s) {
            if (s === null || s === undefined) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }

        function gerarDocxCotacaoCoupaXml(cotacoes) {
            const lista = Array.isArray(cotacoes) ? cotacoes : [cotacoes];
            const paragraphs = [];

            lista.forEach((ev, evIdx) => {
                if (!ev) return;

                // Separador entre eventos (se houver mais de um, conforme o robô Coupa)
                if (evIdx > 0) {
                    paragraphs.push(`    <w:p><w:pPr><w:spacing w:before="200" w:after="0" w:line="240" w:lineRule="auto"/></w:pPr><w:r><w:t>____________________________________________________________________________________________________</w:t></w:r></w:p>`);
                }

                // Alerta de marca bloqueada
                const bloqueio = ev['marca_bloqueada'] || ev['bloqueado'] || ev['BLOQUEADO'];
                if (bloqueio) {
                    paragraphs.push(`    <w:p><w:r><w:rPr><w:b/><w:color w:val="FF0000"/></w:rPr><w:t xml:space="preserve">⚠️ BLOQUEADO: ${escaparXml(bloqueio)}</w:t></w:r></w:p>`);
                }

                // Cabeçalho: REQ: ... | EVENTO: ... ou COTAÇÃO: #...
                const reqNum = ev['req_num'] || ev['REQ'] || ev['REQUISICAO'] || '';
                const numEvento = ev['numero_evento'] || ev['COTAÇÃO'] || ev['COTACAO'] || ev['NUMERO'] || ev['ID'] || '-';
                let textoEvento = '';
                if (reqNum) {
                    textoEvento = `REQ: ${reqNum} | EVENTO: ${numEvento}`;
                } else {
                    textoEvento = `COTAÇÃO: #${numEvento}`;
                }
                if (ev['tem_anexo'] || ev['anexo']) {
                    textoEvento += ' *contem anexo*';
                }

                const dataVenc = ev['data_vencimento'] || ev['VENCIMENTO'] || '-';

        function criarZipStorePuro(arquivos) {
            const encoder = typeof TextEncoder !== 'undefined' ? new TextEncoder() : null;
            function stringToUint8(str) {
                if (encoder) return encoder.encode(str);
                if (typeof Buffer !== 'undefined') return new Uint8Array(Buffer.from(str, 'utf-8'));
                const arr = new Uint8Array(str.length);
                for (let i = 0; i < str.length; i++) arr[i] = str.charCodeAt(i) & 0xff;
                return arr;
            }

            const crcTable = new Uint32Array(256);
            for (let i = 0; i < 256; i++) {
                let c = i;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                crcTable[i] = c;
            }
            function calcCrc32(bytes) {
                let crc = 0xFFFFFFFF;
                for (let i = 0; i < bytes.length; i++) {
                    crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
                }
                return (crc ^ 0xFFFFFFFF) >>> 0;
            }

            const partesLocal = [];
            const partesCentral = [];
            let offset = 0;

            for (const arq of arquivos) {
                const nomeBytes = stringToUint8(arq.nome);
                const dataBytes = (typeof arq.conteudo === 'string')
                    ? stringToUint8(arq.conteudo)
                    : (arq.conteudo instanceof Uint8Array ? arq.conteudo : new Uint8Array(arq.conteudo));
                const crc = calcCrc32(dataBytes);
                const tamanho = dataBytes.length;

                const localHeader = new Uint8Array(30);
                const lhView = new DataView(localHeader.buffer, localHeader.byteOffset, localHeader.byteLength);
                lhView.setUint32(0, 0x04034b50, true);
                lhView.setUint16(4, 20, true);
                lhView.setUint16(6, 0x0800, true);
                lhView.setUint16(8, 0, true);
                lhView.setUint16(10, 0, true);
                lhView.setUint16(12, 0, true);
                lhView.setUint32(14, crc, true);
                lhView.setUint32(18, tamanho, true);
                lhView.setUint32(22, tamanho, true);
                lhView.setUint16(26, nomeBytes.length, true);
                lhView.setUint16(28, 0, true);

                partesLocal.push(localHeader, nomeBytes, dataBytes);

                const centralHeader = new Uint8Array(46);
                const chView = new DataView(centralHeader.buffer, centralHeader.byteOffset, centralHeader.byteLength);
                chView.setUint32(0, 0x02014b50, true);
                chView.setUint16(4, 20, true);
                chView.setUint16(6, 20, true);
                chView.setUint16(8, 0x0800, true);
                chView.setUint16(10, 0, true);
                chView.setUint16(12, 0, true);
                chView.setUint16(14, 0, true);
                chView.setUint32(16, crc, true);
                chView.setUint32(20, tamanho, true);
                chView.setUint32(24, tamanho, true);
                chView.setUint16(28, nomeBytes.length, true);
                chView.setUint16(30, 0, true);
                chView.setUint16(32, 0, true);
                chView.setUint16(34, 0, true);
                chView.setUint16(36, 0, true);
                chView.setUint32(38, 0, true);
                chView.setUint32(42, offset, true);

                partesCentral.push(centralHeader, nomeBytes);
                offset += 30 + nomeBytes.length + tamanho;
            }

            const centralOffset = offset;
            let centralSize = 0;
            for (const p of partesCentral) centralSize += p.length;

            const eocd = new Uint8Array(22);
            const eocdView = new DataView(eocd.buffer, eocd.byteOffset, eocd.byteLength);
            eocdView.setUint32(0, 0x06054b50, true);
            eocdView.setUint16(4, 0, true);
            eocdView.setUint16(6, 0, true);
            eocdView.setUint16(8, arquivos.length, true);
            eocdView.setUint16(10, arquivos.length, true);
            eocdView.setUint32(12, centralSize, true);
            eocdView.setUint32(16, centralOffset, true);
            eocdView.setUint16(20, 0, true);

            const todasPartes = [...partesLocal, ...partesCentral, eocd];
            let totalLen = 0;
            for (const p of todasPartes) totalLen += p.length;

            const resultado = new Uint8Array(totalLen);
            let pos = 0;
            for (const p of todasPartes) {
                resultado.set(p, pos);
                pos += p.length;
            }
            return resultado;
        }

        async function obterJSZip() {
            if (typeof JSZip !== 'undefined') return JSZip;
            if (typeof window !== 'undefined' && window.JSZip) return window.JSZip;

            if (typeof document !== 'undefined') {
                const fontes = [
                    'vendor/jszip.min.js',
                    'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
                    'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'
                ];
                for (const src of fontes) {
                    try {
                        await new Promise((resolve, reject) => {
                            const s = document.createElement('script');
                            s.src = src;
                            s.onload = () => resolve();
                            s.onerror = () => reject();
                            document.head.appendChild(s);
                        });
                        if (typeof JSZip !== 'undefined') return JSZip;
                        if (typeof window !== 'undefined' && window.JSZip) return window.JSZip;
                    } catch (_) {}
                }
            }
            return null;
        }

        async function gerarDocxCotacaoCoupaBlob(cotacoes, options = {}) {
            let ZipClass = null;
            try {
                ZipClass = await obterJSZip();
            } catch (_) {}

            const arquivosDocx = [
                {
                    nome: '[Content_Types].xml',
                    conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`
                },
                {
                    nome: '_rels/.rels',
                    conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`
                },
                {
                    nome: 'word/_rels/document.xml.rels',
                    conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`
                },
                {
                    nome: 'word/styles.xml',
                    conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault>
      <w:rPr>
        <w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>
        <w:sz w:val="18"/>
        <w:szCs w:val="18"/>
        <w:lang w:val="pt-BR"/>
      </w:rPr>
    </w:rPrDefault>
    <w:pPrDefault>
      <w:pPr>
        <w:spacing w:after="0" w:line="240" w:lineRule="auto"/>
      </w:pPr>
    </w:pPrDefault>
  </w:docDefaults>
  <w:style w:type="paragraph" w:default="1" w:styleId="Normal">
    <w:name w:val="Normal"/>
    <w:qFormat/>
    <w:rPr>
      <w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>
      <w:sz w:val="18"/>
      <w:szCs w:val="18"/>
    </w:rPr>
    <w:pPr>
      <w:spacing w:after="0" w:line="240" w:lineRule="auto"/>
    </w:pPr>
  </w:style>
</w:styles>`
                },
                {
                    nome: 'word/document.xml',
                    conteudo: gerarDocxCotacaoCoupaXml(cotacoes)
                }
            ];

            if (ZipClass) {
                const zip = new ZipClass();
                for (const arq of arquivosDocx) {
                    zip.file(arq.nome, arq.conteudo);
                }

                let outputType = options.type;
                if (!outputType) {
                    if (ZipClass.support && ZipClass.support.blob) {
                        outputType = 'blob';
                    } else if (typeof window !== 'undefined' && typeof Blob !== 'undefined') {
                        outputType = 'uint8array';
                    } else {
                        outputType = 'nodebuffer';
                    }
                }

                const rawData = await zip.generateAsync({
                    type: outputType,
                    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                });

                if (outputType === 'uint8array' && typeof Blob !== 'undefined') {
                    return new Blob([rawData], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
                }
                return rawData;
            }

            // Fallback imediato: gerador ZIP nativo puro, sem necessidade de JSZip nem rede externa
            const bytes = criarZipStorePuro(arquivosDocx);
            if (options.type === 'nodebuffer' && typeof Buffer !== 'undefined') {
                return Buffer.from(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            }
            if (options.type === 'uint8array') {
                return bytes;
            }
            if (typeof Blob !== 'undefined') {
                return new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
            }
            if (typeof Buffer !== 'undefined') {
                return Buffer.from(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            }
            return bytes;
        }

        async function exportarCotacaoWordCore(cota, btnTrigger) {
            let origHtml = null;
            if (btnTrigger) {
                btnTrigger.disabled = true;
                origHtml = btnTrigger.innerHTML;
                btnTrigger.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Word';
            }

            try {
                const idCotacao = String(cota['COTAÇÃO'] || cota['COTACAO'] || cota['NUMERO'] || cota['ID'] || 'cotacao')
                    .replace(/[^a-zA-Z0-9_-]/g, '_') || 'cotacao';
                const nomeArquivo = `Cotacao_${idCotacao}.docx`;

                const blob = await gerarDocxCotacaoCoupaBlob(cota);
                baixarBlob(blob, nomeArquivo);

                console.error('Erro ao exportar cotação para Word:', err);
                alert('Não foi possível gerar o documento Word: ' + (err.message || 'Erro desconhecido'));

                if (btnTrigger) {
                    btnTrigger.disabled = false;
                    if (origHtml) btnTrigger.innerHTML = origHtml;
                }
            }
        }

        function obterTextoStatus(c) {
            if (isRespondida(c)) return 'Respondida';
            const info = calcularPrioridadeVencimento(c);
            if (info.diffDias === 0) return 'Pendente (Vence Hoje)';
            if (info.diffDias === 1) return 'Pendente (Vence Amanhã)';
            if (info.diffDias > 1 && info.diffDias <= 7) return `Pendente (Em ${info.diffDias}d)`;
            if (info.diffDias !== null && info.diffDias < 0) return 'Vencida';
            return 'Pendente';
        }

        function baixarBlob(blob, nomeArquivo) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = nomeArquivo;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function exportarCsvFallback(registros, nomeArquivo) {
            const colunas = ['COTAÇÃO', 'STATUS', 'VENCIMENTO', 'LOCALIDADE', 'ITEM', 'QUANTIDADE', 'MODELOS', 'MARCAS', 'RESPOSTA', 'VENDEDOR'];
            const linhas = [colunas.join(';')];

            registros.forEach(r => {
                const valores = [
                    r['COTAÇÃO'] ?? '',
                    obterTextoStatus(r),
                    r['VENCIMENTO'] ?? '',
                    r['LOCALIDADE'] ?? '',
                    (r['ITEM'] || r['ITENS'] || '').replace(/\r?\n/g, ' '),
                    r['QUANTIDADE'] || r['QTD'] || '',
                    r['MODELOS'] || r['MODELO'] || '',
                    r['MARCAS '] || r['MARCAS'] || r['MARCA'] || '',
                    r['RESPOSTA'] ?? '',
                    r['VENDEDOR'] ?? ''
                ];
                const linhaEscapada = valores.map(v => {
                    const s = String(v ?? '').replace(/"/g, '""');
                    return /[;"\n]/.test(s) ? `"${s}"` : s;
                }).join(';');
                linhas.push(linhaEscapada);
            });

            const csvConteudo = '\uFEFF' + linhas.join('\r\n');
            const blob = new Blob([csvConteudo], { type: 'text/csv;charset=utf-8;' });
            baixarBlob(blob, nomeArquivo);
        }

        async function exportarMinhasCotacoesExcel() {
            const registros = Array.isArray(window.cotacoesFiltradas)

                : (cotacoesFiltradas || []);
            if (!registros.length) {
                alert('Nenhuma cotação encontrada para exportar com os filtros atuais.');
                return;
            }

            const botoes = [
                document.getElementById('btn-exportar-excel'),
                document.getElementById('btn-top-exportar')
            ].filter(Boolean);

            botoes.forEach(b => {
                b.disabled = true;
                b._origHtml = b.innerHTML;
                b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gerando...';
            });

            try {
                const vendedorNome = (vendedorLogado || 'vendedor').trim();
                const vendedorSanitizado = vendedorNome.toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]/g, '_') || 'vendedor';
                const hojeIso = new Date().toISOString().slice(0, 10);
                const nomeArquivo = `cotacoes_${vendedorSanitizado}_${hojeIso}.xlsx`;

                if (typeof ExcelJS !== 'undefined') {
                    const normalizar = nome => String(nome || '').trim().toUpperCase()
                        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]/g, '');

                    const padraoColunas = [
                        { nome: 'COTAÇÃO', largura: 22, campos: ['COTAÇÃO', 'COTACAO', 'NUMERO', 'ID'] },
                        { nome: 'STATUS', largura: 22, ehStatus: true },
                        { nome: 'VENCIMENTO', largura: 16, campos: ['VENCIMENTO', 'DATA_VENCIMENTO'] },
                        { nome: 'LOCALIDADE', largura: 24, campos: ['LOCALIDADE', 'CIDADE'] },
                        { nome: 'ITEM', largura: 55, campos: ['ITEM', 'ITENS', 'DESCRICAO', 'PRODUTO'] },
                        { nome: 'QUANTIDADE', largura: 14, campos: ['QUANTIDADE', 'QTD'] },
                        { nome: 'MODELOS', largura: 22, campos: ['MODELOS', 'MODELO'] },
                        { nome: 'MARCAS', largura: 22, campos: ['MARCAS', 'MARCA', 'MARCAS '] },
                        { nome: 'RESPOSTA', largura: 20, campos: ['RESPOSTA'] },
                        { nome: 'VENDEDOR', largura: 20, campos: ['VENDEDOR'] }
                    ];

                    const todasChaves = [...new Set(registros.flatMap(r => Object.keys(r || {})))];
                    const chavesUsadas = new Set();

                    const colunasFinais = padraoColunas.map(col => {
                        if (col.ehStatus) return col;
                        const nomesNorm = (col.campos || []).map(normalizar);
                        const camposReais = todasChaves.filter(k => nomesNorm.includes(normalizar(k)));
                        camposReais.forEach(k => chavesUsadas.add(k));
                        return { ...col, camposReais };
                    });

                    todasChaves.filter(k => !chavesUsadas.has(k)).forEach(k => {
                        colunasFinais.push({ nome: k.trim().toUpperCase(), largura: 24, camposReais: [k] });
                    });

                    const wb = new ExcelJS.Workbook();
                    wb.creator = 'Maestro';
                    wb.lastModifiedBy = vendedorNome || 'Maestro';
                    wb.created = new Date();

                    const ws = wb.addWorksheet('Minhas Cotações', {
                        views: [{ state: 'frozen', ySplit: 1 }]
                    });

                    ws.columns = colunasFinais.map(c => ({
                        header: c.nome,
                        width: c.largura || 20
                    }));

                    registros.forEach(r => {
                        const linhaValores = colunasFinais.map(col => {
                            if (col.ehStatus) return obterTextoStatus(r);
                            const campoEncontrado = (col.camposReais || []).find(k => r[k] != null && r[k] !== '');
                            const val = campoEncontrado !== undefined ? r[campoEncontrado] : '';
                            return typeof val === 'number' || typeof val === 'boolean' ? val : String(val ?? '');
                        });
                        ws.addRow(linhaValores);
                    });

                    const bordaFina = { style: 'thin', color: { argb: 'FFD1D5DB' } };

                    ws.eachRow((row, rowNumber) => {
                        if (rowNumber === 1) {
                            row.height = 30;
                            row.eachCell({ includeEmpty: true }, cell => {
                                cell.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
                                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E293B' } };
                                cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: false };
                                cell.border = { top: bordaFina, left: bordaFina, bottom: bordaFina, right: bordaFina };
                            });
                        } else {
                            row.height = 26;
                            const cota = registros[rowNumber - 2];
                            const statusStr = cota ? obterTextoStatus(cota) : '';

                            row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                                cell.font = { name: 'Calibri', size: 10.5 };
                                const colDef = colunasFinais[colNumber - 1];
                                const ehCentralizado = colDef && (
                                    colDef.ehStatus || 
                                    ['COTAÇÃO', 'VENCIMENTO', 'QUANTIDADE', 'RESPOSTA'].includes(colDef.nome)
                                );

                                cell.alignment = {
                                    vertical: 'middle',
                                    horizontal: ehCentralizado ? 'center' : 'left',
                                    wrapText: colDef && colDef.nome === 'ITEM'
                                };
                                cell.border = { top: bordaFina, left: bordaFina, bottom: bordaFina, right: bordaFina };

                                if (colDef && colDef.ehStatus) {
                                    if (statusStr.includes('Respondida')) {
                                        cell.font = { name: 'Calibri', size: 10.5, bold: true, color: { argb: 'FF047857' } };
                                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD1FAE5' } };
                                    } else if (statusStr.includes('Hoje')) {
                                        cell.font = { name: 'Calibri', size: 10.5, bold: true, color: { argb: 'FFB45309' } };
                                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF3C7' } };
                                    }
                                }
                            });
                        }
                    });

                    ws.autoFilter = {
                        from: { row: 1, column: 1 },
                        to: { row: registros.length + 1, column: colunasFinais.length }
                    };

                    const buffer = await wb.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    baixarBlob(blob, nomeArquivo);
                } else {
                    exportarCsvFallback(registros, nomeArquivo.replace(/\.xlsx$/, '.csv'));
                }
            } catch (err) {
                console.error('Erro ao exportar cotações para Excel:', err);
                alert('Não foi possível gerar a planilha Excel: ' + (err.message || 'Erro desconhecido'));
            } finally {
                botoes.forEach(b => {
                    b.disabled = false;
                    if (b._origHtml) b.innerHTML = b._origHtml;
                });
            }
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => carregarMinhasCotacoes());
    </script>
    <script src="minhas-cotacoes/tela.js"></script>
</body>
</html>

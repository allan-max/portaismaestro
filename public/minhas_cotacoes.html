<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAESTRO | Minhas Cotações</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --bg-body: #10141b;
            --bg-navbar: #161b22;
            --bg-card: #1c2433;
            --bg-card-hover: #212b3d;
            --bg-search: #161b22;
            --text-main: #f8fafc;
            --text-muted: #8b9eb3;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --border-color: #2a3441;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            background-color: var(--bg-body) !important;
            color: var(--text-main) !important;
            overflow-y: scroll;
        }

        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-navbar);
            padding: 0 24px;
            height: 64px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .vendedor-badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-top {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-top:hover { background: rgba(255,255,255,0.1); }
        .btn-top.logout { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }

        .page-content {
            padding: 30px 40px 80px 40px;
            max-width: 1500px;
            margin: 0 auto;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }
        .kpi-card:hover, .kpi-card.active-filter {
            border-color: #38bdf8;
            background: var(--bg-card-hover);
        }

        .kpi-title { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 6px; }
        .kpi-value { font-size: 1.7rem; font-weight: 800; }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            background: var(--bg-search);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }

        .filter-select {
            background: var(--bg-navbar);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }

        /* Table */
        .modern-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .modern-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0 20px 5px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .modern-table td {
            background: var(--bg-card);
            padding: 16px 20px;
            vertical-align: middle;
            transition: background 0.15s ease;
        }

        .modern-table tr td:first-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .modern-table tr td:last-child {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .modern-table tr:hover td {
            background: var(--bg-card-hover);
        }

        .blue-pill {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-badge.ok { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .status-badge.pend { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .status-badge.nok { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .btn-responder {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-responder:hover {
            background: #10b981;
            color: #000;
        }
    </style>
</head>
<body>

    <nav class="top-navbar">
        <div class="brand-area">
            <i class="fa-solid fa-file-signature" style="color: #38bdf8; font-size: 1.3rem;"></i>
            <span>Minhas Cotações</span>
            <span id="badge-vendedor" class="vendedor-badge">Carregando...</span>
        </div>
        <div class="nav-actions">
            <button class="btn-top" onclick="carregarMinhasCotacoes()">
                <i class="fa-solid fa-rotate"></i> Atualizar
            </button>
            <a href="planilha_vale.html" class="btn-top" title="Ver Planilha Geral">
                <i class="fa-solid fa-table"></i> Planilha Geral
            </a>
            <a href="index.html?portais=1" class="btn-top" title="Ir para os Robôs / Portais">
                <i class="fa-solid fa-robot"></i> Portais
            </a>
            <button class="btn-top logout" onclick="fazerLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>
    </nav>

    <div class="page-content">
        <!-- Cards de Resumo (Clicáveis para filtrar) -->
        <div class="kpi-grid">
            <div class="kpi-card active-filter" id="kpi-todas" onclick="setFiltroStatus('todas')">
                <div>
                    <div class="kpi-title">Total Atribuídas a Você</div>
                    <div class="kpi-value" id="count-total">0</div>
                </div>
                <i class="fa-solid fa-layer-group" style="font-size: 1.8rem; color: #38bdf8;"></i>
            </div>
            <div class="kpi-card" id="kpi-pendentes" onclick="setFiltroStatus('pendentes')">
                <div>
                    <div class="kpi-title">Pendentes / Em Aberto</div>
                    <div class="kpi-value" id="count-pendentes" style="color: #fbbf24;">0</div>
                </div>
                <i class="fa-solid fa-clock" style="font-size: 1.8rem; color: #fbbf24;"></i>
            </div>
            <div class="kpi-card" id="kpi-respondidas" onclick="setFiltroStatus('respondidas')">
                <div>
                    <div class="kpi-title">Respondidas</div>
                    <div class="kpi-value" id="count-respondidas" style="color: #34d399;">0</div>
                </div>
                <i class="fa-solid fa-circle-check" style="font-size: 1.8rem; color: #34d399;"></i>
            </div>
        </div>

        <!-- Barra de Busca e Ordenação -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" id="input-busca" placeholder="Buscar por número da cotação, item, marca, modelo ou localidade..." oninput="aplicarFiltros()">
            </div>
            <select id="select-ordem" class="filter-select" onchange="aplicarFiltros()">
                <option value="padrao">Ordem: Mais recentes na planilha</option>
                <option value="venc_asc">Vencimento: Mais próximas primeiro</option>
                <option value="venc_desc">Vencimento: Mais distantes primeiro</option>
            </select>
        </div>

        <!-- Tabela de Cotações -->
        <table class="modern-table">
            <thead>
                <tr>
                    <th style="width: 14%;">Cotação</th>
                    <th style="width: 12%;">Vencimento</th>
                    <th style="width: 16%;">Localidade</th>
                    <th style="width: 30%;">Item / Descrição</th>
                    <th style="width: 14%;">Status</th>
                    <th style="width: 14%; text-align: right;">Ação Rápida</th>
                </tr>
            </thead>
            <tbody id="tbody-cotacoes">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                        <i class="fa-solid fa-spinner fa-spin"></i> Carregando suas cotações...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal de Detalhes da Cotação -->
    <div id="modal-detalhes" style="position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 99999;">
        <div style="background: #1c2433; border: 1px solid #2a3441; border-radius: 12px; padding: 25px; width: 90%; max-width: 850px; max-height: 88vh; overflow-y: auto; position: relative;">
            <button onclick="document.getElementById('modal-detalhes').style.display='none'" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: #8b9eb3; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 id="modal-titulo" style="margin-top: 0; color: #f8fafc; border-bottom: 1px solid #2a3441; padding-bottom: 12px;">Detalhes da Cotação</h2>
            <div id="modal-corpo" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
        const sessionAtual = localStorage.getItem('maestro_session');
        const vendedorLogado = (localStorage.getItem('maestro_vendedor') || '').trim();

        if (!sessionAtual) {
            window.location.href = 'index.html';
        }

        document.getElementById('badge-vendedor').innerText = vendedorLogado 
            ? `Vendedor: ${vendedorLogado.toUpperCase()}` 
            : 'Sem vendedor vinculado';

        const socket = io({ auth: { sessionId: sessionAtual }, transports: ['websocket'], upgrade: false });

        socket.emit('sou_frontend', { sessionId: sessionAtual, usuario: localStorage.getItem('maestro_user') });

        socket.on('sessao_invalida', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });

        socket.on('planilha_atualizada', () => carregarMinhasCotacoes(true));

        let todasCotacoes = [];
        let cotacoesFiltradas = [];
        let filtroStatusAtual = 'todas';

        function escHtml(v) {
            return String(v ?? '-').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function carregarMinhasCotacoes(silencioso = false) {
            if (!silencioso) {
                document.getElementById('tbody-cotacoes').innerHTML = `
                    <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                        <i class="fa-solid fa-spinner fa-spin"></i> Atualizando suas cotações...
                    </td></tr>`;
            }
            socket.emit('solicitar_planilha_json', { origem: 'todas', apenas_meu_vendedor: true });
        }

        function isRespondida(c) {
            const resp = String(c['RESPOSTA'] || '').trim().toUpperCase();
            return (resp.includes('RESPONDID')) && !resp.includes('NÃO') && !resp.includes('NAO');
        }

        function parseDataVenc(valor) {
            const match = String(valor || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (!match) return null;
            const p1 = Number(match[1]), p2 = Number(match[2]), yr = Number(match[3]);
            const d = p2 > 12 ? p2 : p1;
            const m = p2 > 12 ? p1 : p2;
            return new Date(yr, m - 1, d).getTime();
        }

        socket.on('retorno_planilha_json', (res) => {
            if (!res.sucesso) {
                document.getElementById('tbody-cotacoes').innerHTML = `
                    <tr><td colspan="6" style="text-align: center; padding: 30px; color: #f87171;">
                        Erro ao carregar cotações: ${escHtml(res.erro)}
                    </td></tr>`;
                return;
            }
            todasCotacoes = res.cotacoes || [];
            atualizarContadores();
            aplicarFiltros();
        });

        function atualizarContadores() {
            const total = todasCotacoes.length;
            const resp = todasCotacoes.filter(c => isRespondida(c)).length;
            const pend = total - resp;

            document.getElementById('count-total').innerText = total;
            document.getElementById('count-respondidas').innerText = resp;
            document.getElementById('count-pendentes').innerText = pend;
        }

        function setFiltroStatus(status) {
            filtroStatusAtual = status;
            document.querySelectorAll('.kpi-card').forEach(el => el.classList.remove('active-filter'));
            document.getElementById('kpi-' + status).classList.add('active-filter');
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const busca = document.getElementById('input-busca').value.trim().toLowerCase();
            const ordem = document.getElementById('select-ordem').value;

            cotacoesFiltradas = todasCotacoes.filter(c => {
                if (filtroStatusAtual === 'pendentes' && isRespondida(c)) return false;
                if (filtroStatusAtual === 'respondidas' && !isRespondida(c)) return false;

                if (busca) {
                    return Object.values(c).some(v => String(v || '').toLowerCase().includes(busca));
                }
                return true;
            });

            if (ordem === 'venc_asc' || ordem === 'venc_desc') {
                const dir = ordem === 'venc_asc' ? 1 : -1;
                cotacoesFiltradas.sort((a, b) => {
                    const tA = parseDataVenc(a['VENCIMENTO']);
                    const tB = parseDataVenc(b['VENCIMENTO']);
                    if (tA === null) return 1;
                    if (tB === null) return -1;
                    return (tA - tB) * dir;
                });
            }

            renderizarTabela();
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tbody-cotacoes');
            if (cotacoesFiltradas.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                        Nenhuma cotação encontrada para este filtro.
                    </td></tr>`;
                return;
            }

            tbody.innerHTML = cotacoesFiltradas.map((c, idx) => {
                const respondida = isRespondida(c);
                const respTexto = String(c['RESPOSTA'] || '').trim() || 'PENDENTE';
                const classeBadge = respondida ? 'ok' : (respTexto.toUpperCase().includes('NÃO') ? 'nok' : 'pend');
                const itemResumo = String(c['ITEM'] || c['ITENS'] || '-');

                return `
                    <tr onclick="abrirDetalhes(${idx})" style="cursor: pointer;">
                        <td>
                            <div style="font-weight: 700; font-size: 1rem;">#${escHtml(c['COTAÇÃO'] || '-')}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">Qtd: ${escHtml(c['QUANTIDADE'] || '-')}</div>
                        </td>
                        <td><span class="blue-pill">${escHtml(c['VENCIMENTO'] || '-')}</span></td>
                        <td>${escHtml(c['LOCALIDADE'] || '-')}</td>
                        <td>
                            <div style="max-width: 420px; font-size: 0.82rem; color: #cbd5e1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                                ${escHtml(itemResumo)}
                            </div>
                        </td>
                        <td>
                            <span class="status-badge ${classeBadge}">
                                <i class="fa-solid ${respondida ? 'fa-check' : 'fa-clock'}"></i>
                                ${escHtml(respTexto)}
                            </span>
                        </td>
                        <td style="text-align: right;" onclick="event.stopPropagation();">
                            ${!respondida ? `
                                <button class="btn-responder" onclick="marcarComoRespondida(${idx})">
                                    <i class="fa-solid fa-check"></i> Marcar Respondida
                                </button>
                            ` : `<span style="color: var(--text-muted); font-size: 0.8rem;">Concluída</span>`}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function marcarComoRespondida(idx) {
            const c = cotacoesFiltradas[idx];
            if (!c) return;
            if (!confirm(`Confirmar que a cotação #${c['COTAÇÃO']} foi RESPONDIDA?`)) return;

            const identidade = {
                'COTAÇÃO': String(c['COTAÇÃO'] ?? ''),
                'VENDEDOR': String(c['VENDEDOR'] ?? ''),
                'LOCALIDADE': String(c['LOCALIDADE'] ?? ''),
                'ITEM': String(c['ITEM'] ?? ''),
                'VENCIMENTO': String(c['VENCIMENTO'] ?? '')
            };
            socket.emit('marcar_cotacao_respondida', { identidade });
        }

        socket.on('resposta_acao_linha', (res) => {
            if (res.sucesso) {
                carregarMinhasCotacoes(true);
            } else {
                alert('Erro: ' + (res.erro || 'Não foi possível atualizar a cotação.'));
            }
        });

        function abrirDetalhes(idx) {
            const c = cotacoesFiltradas[idx];
            if (!c) return;
            document.getElementById('modal-titulo').innerText = `Cotação #${c['COTAÇÃO'] || ''}`;

            let html = '';
            for (const chave in c) {
                const val = escHtml(c[chave] || '-').replace(/\n/g, '<br>');
                const destaque = (chave === 'ITEM' || chave === 'ITENS') ? 'grid-column: span 2;' : '';
                html += `
                    <div style="background: #161b22; border: 1px solid #2a3441; padding: 12px; border-radius: 8px; ${destaque}">
                        <div style="font-size: 0.72rem; color: #8b9eb3; font-weight: 700; text-transform: uppercase; margin-bottom: 5px;">${escHtml(chave)}</div>
                        <div style="font-size: 0.92rem; color: #f8fafc; word-break: break-word; line-height: 1.4;">${val}</div>
                    </div>
                `;
            }
            document.getElementById('modal-corpo').innerHTML = html;
            document.getElementById('modal-detalhes').style.display = 'flex';
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => carregarMinhasCotacoes());
    </script>
</body>
</html>

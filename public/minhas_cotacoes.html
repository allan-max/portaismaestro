<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAESTRO | Minhas Cotações</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --bg-body: #0b0e14;
            --bg-surface: #121620;
            --bg-surface-hover: #171c28;
            --bg-header-row: #181d29;
            --text-main: #f1f5f9;
            --text-muted: #8b95a5;
            --text-dim: #64748b;
            --border-color: #222938;
            --accent-amber: #d99b26;
            --accent-green: #10b981;
            --accent-blue: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            background-color: var(--bg-body) !important;
            color: var(--text-main) !important;
            overflow-y: scroll;
        }

        .page-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 40px 80px 40px;
        }

        /* Top Header */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
        }

        .brand-title {
            font-size: 1.65rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.4px;
        }

        .vendedor-badge {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
            margin-left: 4px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-top {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-top i {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .btn-top:hover {
            background: var(--bg-surface-hover);
            border-color: #333d52;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a3446, #181e29);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            margin-left: 4px;
            overflow: hidden;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        @media (max-width: 900px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }

        .kpi-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px 24px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .kpi-card:hover {
            background: var(--bg-surface-hover);
        }

        .kpi-card.active-filter {
            border-color: #364156;
        }

        .kpi-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .kpi-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .kpi-card.active-filter .kpi-title-pill {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 6px;
            color: #cbd5e1;
        }

        .kpi-icon-small {
            color: var(--text-muted);
            font-size: 0.95rem;
            opacity: 0.7;
        }

        .kpi-value {
            font-size: 2.6rem;
            font-weight: 500;
            line-height: 1.1;
            margin-top: 10px;
            letter-spacing: -1px;
        }

        /* Toolbar (Search & Sort) */
        .toolbar {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 260px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 11px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box i {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .search-box input::placeholder {
            color: var(--text-dim);
        }

        .sort-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            height: 42px;
            font-size: 0.88rem;
        }

        .sort-label {
            color: var(--text-dim);
            margin-right: 4px;
            white-space: nowrap;
        }

        .filter-select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.88rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            cursor: pointer;
            padding-right: 6px;
        }

        .filter-select option {
            background: var(--bg-surface);
            color: var(--text-main);
        }

        /* Section Heading */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 14px 0;
        }

        /* Unified Table Card */
        .table-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .modern-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .modern-table thead tr {
            background: var(--bg-header-row);
            border-bottom: 1px solid var(--border-color);
        }

        .modern-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.82rem;
            padding: 13px 20px;
            text-align: left;
        }

        .modern-table tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s ease;
        }

        .modern-table tbody tr:last-child {
            border-bottom: none;
        }

        .modern-table tbody tr:hover {
            background: var(--bg-surface-hover);
        }

        .modern-table td {
            padding: 18px 20px;
            vertical-align: middle;
            font-size: 0.92rem;
            color: var(--text-main);
        }

        /* Table Cells Formatting */
        .cota-id {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .cota-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.35;
        }

        .venc-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .venc-date {
            color: var(--text-main);
            font-size: 0.92rem;
        }

        .venc-sub {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .tag-icon-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.07);
            color: #94a3b8;
            width: 24px;
            height: 22px;
            border-radius: 5px;
            font-size: 0.72rem;
        }

        .desc-text {
            color: #dce3ec;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Status Pills */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .status-badge.pend-amber {
            background: rgba(217, 155, 38, 0.16);
            color: #eab308;
        }

        .status-badge.pend-amber .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #eab308;
        }

        .status-badge.pend-green {
            background: rgba(16, 185, 129, 0.14);
            color: #34d399;
        }

        .status-badge.ok {
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
        }

        /* Action Button */
        .btn-responder {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #2e374a;
            color: #dce3ec;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-responder i {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .btn-responder:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.5);
            color: #34d399;
        }

        .btn-responder:hover i {
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Top Navbar -->
        <nav class="top-navbar">
            <div class="brand-area">
                <div class="brand-logo">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="8" width="10" height="20" rx="3" fill="#0ea5e9"/>
                        <rect x="16" y="4" width="10" height="14" rx="3" fill="#38bdf8"/>
                    </svg>
                </div>
                <span class="brand-title">Minhas Cotações</span>
                <span id="badge-vendedor" class="vendedor-badge">Carregando...</span>
            </div>

            <div class="nav-actions">
                <button class="btn-top" onclick="carregarMinhasCotacoes()">
                    <i class="fa-solid fa-rotate-right"></i> Atualizar
                </button>
                <a id="btn-nav-planilha" href="planilha_vale.html" class="btn-top" style="display: none;" title="Ver Planilha Geral">
                    <i class="fa-solid fa-table"></i> Planilha Geral
                </a>
                <a id="btn-nav-portais" href="index.html?portais=1" class="btn-top" style="display: none;" title="Ir para os Robôs / Portais">
                    <i class="fa-solid fa-robot"></i> Portais
                </a>
                <button class="btn-top" onclick="fazerLogout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </button>
                <div class="user-avatar" id="avatar-vendedor" title="Usuário Logado">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </nav>

        <!-- Cards de Resumo -->
        <div class="kpi-grid">
            <div class="kpi-card active-filter" id="kpi-todas" onclick="setFiltroStatus('todas')">
                <div class="kpi-header">
                    <span class="kpi-title kpi-title-pill">Total Atribuídas a Você</span>
                    <i class="fa-regular fa-clone kpi-icon-small"></i>
                </div>
                <div class="kpi-value" id="count-total" style="color: #ffffff;">0</div>
            </div>

            <div class="kpi-card" id="kpi-pendentes" onclick="setFiltroStatus('pendentes')">
                <div class="kpi-header">
                    <span class="kpi-title kpi-title-pill">Pendentes / Em Aberto</span>
                </div>
                <div class="kpi-value" id="count-pendentes" style="color: var(--accent-amber);">0</div>
            </div>

            <div class="kpi-card" id="kpi-respondidas" onclick="setFiltroStatus('respondidas')">
                <div class="kpi-header">
                    <span class="kpi-title kpi-title-pill">Respondidas</span>
                </div>
                <div class="kpi-value" id="count-respondidas" style="color: var(--accent-green);">0</div>
            </div>
        </div>

        <!-- Barra de Busca e Ordenação -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="input-busca" placeholder="Buscar por número da cotação, item, marca, modelo ou localidade..." oninput="aplicarFiltros()">
            </div>
            <div class="sort-wrapper">
                <span class="sort-label">Ordem:</span>
                <select id="select-ordem" class="filter-select" onchange="aplicarFiltros()">
                    <option value="prioridade" selected>Prioridade (Hoje → Semana → Futuras)</option>
                    <option value="venc_asc">Vencimento: Mais próximas primeiro</option>
                    <option value="venc_desc">Vencimento: Mais distantes primeiro</option>
                    <option value="padrao">Mais recentes na planilha</option>
                </select>
            </div>
        </div>

        <!-- Título da Seção + Tabela Unificada -->
        <h2 class="section-title">Cotações</h2>

        <div class="table-card">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th style="width: 19%;">Cotação / ID</th>
                        <th style="width: 14%;">Vencimento</th>
                        <th style="width: 14%;">Localidade</th>
                        <th style="width: 28%;">Descrição</th>
                        <th style="width: 11%;">Status</th>
                        <th style="width: 14%; text-align: right;">Ação Rápida</th>
                    </tr>
                </thead>
                <tbody id="tbody-cotacoes">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                            <i class="fa-solid fa-spinner fa-spin"></i> Carregando suas cotações...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Detalhes da Cotação -->
    <div id="modal-detalhes" style="position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 99999;">
        <div style="background: #121620; border: 1px solid #222938; border-radius: 12px; padding: 25px; width: 90%; max-width: 850px; max-height: 88vh; overflow-y: auto; position: relative;">
            <button onclick="document.getElementById('modal-detalhes').style.display='none'" style="position: absolute; top: 15px; right: 15px; background: none; border: none; color: #8b95a5; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 id="modal-titulo" style="margin-top: 0; color: #f1f5f9; border-bottom: 1px solid #222938; padding-bottom: 12px;">Detalhes da Cotação</h2>
            <div id="modal-corpo" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
        const sessionAtual = localStorage.getItem('maestro_session');
        const vendedorLogado = (localStorage.getItem('maestro_vendedor') || '').trim();

        if (!sessionAtual) {
            window.location.href = 'index.html';
        }

        const isAdmin = localStorage.getItem('maestro_admin') === 'true';
        const temAcessoPlanilha = isAdmin || localStorage.getItem('maestro_planilha') === 'true';
        const temAcessoPortais = isAdmin || localStorage.getItem('maestro_portais') === 'true';

        if (temAcessoPlanilha) {
            document.getElementById('btn-nav-planilha').style.display = 'flex';
        }
        if (temAcessoPortais) {
            document.getElementById('btn-nav-portais').style.display = 'flex';
        }

        document.getElementById('badge-vendedor').innerText = vendedorLogado 
            ? `Vendedor: ${vendedorLogado.toUpperCase()}` 
            : 'Sem vendedor vinculado';

        if (vendedorLogado) {
            document.getElementById('avatar-vendedor').innerText = vendedorLogado.trim().charAt(0).toUpperCase();
        }

        const socket = io({ auth: { sessionId: sessionAtual }, transports: ['websocket'], upgrade: false });

        socket.emit('sou_frontend', { sessionId: sessionAtual, usuario: localStorage.getItem('maestro_user') });

        socket.on('sessao_invalida', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });

        socket.on('planilha_atualizada', () => carregarMinhasCotacoes(true));

        let todasCotacoes = [];
        let cotacoesFiltradas = [];
        let filtroStatusAtual = 'todas';

        function escHtml(v) {
            return String(v ?? '-').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function carregarMinhasCotacoes(silencioso = false) {
            if (!silencioso) {
                document.getElementById('tbody-cotacoes').innerHTML = `
                    <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                        <i class="fa-solid fa-spinner fa-spin"></i> Atualizando suas cotações...
                    </td></tr>`;
            }
            socket.emit('solicitar_planilha_json', { origem: 'todas', apenas_meu_vendedor: true });
        }

        function isRespondida(c) {
            const resp = String(c['RESPOSTA'] || '').trim().toUpperCase();
            return (resp.includes('RESPONDID')) && !resp.includes('NÃO') && !resp.includes('NAO');
        }

        function parseDataVenc(valor) {
            const match = String(valor || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (!match) return null;
            const p1 = Number(match[1]), p2 = Number(match[2]), yr = Number(match[3]);
            const d = p2 > 12 ? p2 : p1;
            const m = p2 > 12 ? p1 : p2;
            const dt = new Date(yr, m - 1, d);
            dt.setHours(0, 0, 0, 0);
            if (dt.getFullYear() !== yr || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
            return dt.getTime();
        }

        function getHojeMeiaNoite() {
            const h = new Date();
            h.setHours(0, 0, 0, 0);
            return h.getTime();
        }

        function calcularPrioridadeVencimento(c) {
            const tVenc = parseDataVenc(c['VENCIMENTO']);
            if (tVenc === null) return { grupo: 4, ordem: Infinity, diffDias: null };

            const hoje = getHojeMeiaNoite();
            const umDia = 24 * 60 * 60 * 1000;
            const diffDias = Math.round((tVenc - hoje) / umDia);

            if (diffDias === 0) {
                return { grupo: 1, ordem: 0, diffDias };
            } else if (diffDias > 0 && diffDias <= 7) {
                return { grupo: 2, ordem: tVenc, diffDias };
            } else {
                return { grupo: 3, ordem: tVenc, diffDias };
            }
        }

        socket.on('retorno_planilha_json', (res) => {
            if (!res.sucesso) {
                document.getElementById('tbody-cotacoes').innerHTML = `
                    <tr><td colspan="6" style="text-align: center; padding: 30px; color: #f87171;">
                        Erro ao carregar cotações: ${escHtml(res.erro)}
                    </td></tr>`;
                return;
            }

            const hoje = getHojeMeiaNoite();
            todasCotacoes = (res.cotacoes || []).filter(c => {
                const tVenc = parseDataVenc(c['VENCIMENTO']);
                return tVenc !== null && tVenc >= hoje;
            });

            atualizarContadores();
            aplicarFiltros();
        });

        function atualizarContadores() {
            const total = todasCotacoes.length;
            const resp = todasCotacoes.filter(c => isRespondida(c)).length;
            const pend = total - resp;

            document.getElementById('count-total').innerText = total;
            document.getElementById('count-respondidas').innerText = resp;
            document.getElementById('count-pendentes').innerText = pend;
        }

        function setFiltroStatus(status) {
            filtroStatusAtual = status;
            document.querySelectorAll('.kpi-card').forEach(el => el.classList.remove('active-filter'));
            document.getElementById('kpi-' + status).classList.add('active-filter');
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const busca = document.getElementById('input-busca').value.trim().toLowerCase();
            const ordem = document.getElementById('select-ordem').value;

            cotacoesFiltradas = todasCotacoes.filter(c => {
                if (filtroStatusAtual === 'pendentes' && isRespondida(c)) return false;
                if (filtroStatusAtual === 'respondidas' && !isRespondida(c)) return false;

                if (busca) {
                    return Object.values(c).some(v => String(v || '').toLowerCase().includes(busca));
                }
                return true;
            });

            if (ordem === 'prioridade') {
                cotacoesFiltradas.sort((a, b) => {
                    const pA = calcularPrioridadeVencimento(a);
                    const pB = calcularPrioridadeVencimento(b);
                    if (pA.grupo !== pB.grupo) return pA.grupo - pB.grupo;
                    if (pA.ordem !== pB.ordem) return pA.ordem - pB.ordem;
                    return Number(isRespondida(a)) - Number(isRespondida(b));
                });
            } else if (ordem === 'venc_asc' || ordem === 'venc_desc') {
                const dir = ordem === 'venc_asc' ? 1 : -1;
                cotacoesFiltradas.sort((a, b) => {
                    const tA = parseDataVenc(a['VENCIMENTO']);
                    const tB = parseDataVenc(b['VENCIMENTO']);
                    return (tA - tB) * dir;
                });
            }

            renderizarTabela();
        }

        function renderizarVencimento(c, index) {
            const textoData = escHtml(c['VENCIMENTO'] || '-');
            const info = calcularPrioridadeVencimento(c);

            if (info.diffDias === 0) {
                return `
                    <div class="venc-wrapper">
                        <span class="venc-date">${textoData}</span>
                        ${index === 0 ? `<span class="tag-icon-box" title="Vence Hoje"><i class="fa-solid fa-tag"></i></span>` : ''}
                    </div>
                `;
            }
            if (info.diffDias === 1) {
                return `
                    <div>
                        <span class="venc-date">${textoData}</span>
                        <span class="venc-sub">(Amanhã)</span>
                    </div>
                `;
            }
            if (info.diffDias > 1 && info.diffDias <= 7) {
                return `
                    <div>
                        <span class="venc-date">${textoData}</span>
                        <span class="venc-sub">(Em ${info.diffDias}d)</span>
                    </div>
                `;
            }
            return `<span class="venc-date">${textoData}</span>`;
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tbody-cotacoes');
            if (cotacoesFiltradas.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                        Nenhuma cotação encontrada para este filtro.
                    </td></tr>`;
                return;
            }

            tbody.innerHTML = cotacoesFiltradas.map((c, idx) => {
                const respondida = isRespondida(c);
                const infoVenc = calcularPrioridadeVencimento(c);
                const itemResumo = String(c['ITEM'] || c['ITENS'] || '-').replace(/\s+/g, ' ').trim();
                const qtdTexto = String(c['QUANTIDADE'] || '').trim();
                const subtituloId = qtdTexto ? `Qtd: ${escHtml(qtdTexto)}` : escHtml(itemResumo);

                let statusHtml = '';
                if (respondida) {
                    statusHtml = `<span class="status-badge ok">Respondida</span>`;
                } else if (idx === 0 && infoVenc.diffDias === 0) {
                    statusHtml = `<span class="status-badge pend-amber"><span class="dot"></span>Pendente</span>`;
                } else {
                    statusHtml = `<span class="status-badge pend-green">Pendente</span>`;
                }

                return `
                    <tr onclick="abrirDetalhes(${idx})" style="cursor: pointer;">
                        <td>
                            <div class="cota-id" title="#${escHtml(c['COTAÇÃO'] || '-')}">#${escHtml(c['COTAÇÃO'] || '-')}</div>
                            ${subtituloId ? `<div class="cota-sub">${subtituloId}</div>` : ''}
                        </td>
                        <td>${renderizarVencimento(c, idx)}</td>
                        <td>${escHtml(c['LOCALIDADE'] || '-')}</td>
                        <td>
                            <div class="desc-text" title="${escHtml(itemResumo)}">${escHtml(itemResumo)}</div>
                        </td>
                        <td>${statusHtml}</td>
                        <td style="text-align: right;" onclick="event.stopPropagation();">
                            ${!respondida ? `
                                <button class="btn-responder" onclick="marcarComoRespondida(${idx})">
                                    <i class="fa-regular fa-circle-check"></i> Marcar Respondida
                                </button>
                            ` : `<span style="color: var(--text-muted); font-size: 0.84rem;">Concluída</span>`}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function marcarComoRespondida(idx) {
            const c = cotacoesFiltradas[idx];
            if (!c) return;
            if (!confirm(`Confirmar que a cotação #${c['COTAÇÃO']} foi RESPONDIDA?`)) return;

            const identidade = {
                'COTAÇÃO': String(c['COTAÇÃO'] ?? ''),
                'VENDEDOR': String(c['VENDEDOR'] ?? ''),
                'LOCALIDADE': String(c['LOCALIDADE'] ?? ''),
                'ITEM': String(c['ITEM'] ?? ''),
                'VENCIMENTO': String(c['VENCIMENTO'] ?? '')
            };
            socket.emit('marcar_cotacao_respondida', { identidade });
        }

        socket.on('resposta_acao_linha', (res) => {
            if (res.sucesso) {
                carregarMinhasCotacoes(true);
            } else {
                alert('Erro: ' + (res.erro || 'Não foi possível atualizar a cotação.'));
            }
        });

        function abrirDetalhes(idx) {
            const c = cotacoesFiltradas[idx];
            if (!c) return;
            document.getElementById('modal-titulo').innerText = `Cotação #${c['COTAÇÃO'] || ''}`;

            let html = '';
            for (const chave in c) {
                const val = escHtml(c[chave] || '-').replace(/\n/g, '<br>');
                const destaque = (chave === 'ITEM' || chave === 'ITENS') ? 'grid-column: span 2;' : '';
                html += `
                    <div style="background: #181d29; border: 1px solid #222938; padding: 12px; border-radius: 8px; ${destaque}">
                        <div style="font-size: 0.72rem; color: #8b95a5; font-weight: 700; text-transform: uppercase; margin-bottom: 5px;">${escHtml(chave)}</div>
                        <div style="font-size: 0.92rem; color: #f1f5f9; word-break: break-word; line-height: 1.4;">${val}</div>
                    </div>
                `;
            }
            document.getElementById('modal-corpo').innerHTML = html;
            document.getElementById('modal-detalhes').style.display = 'flex';
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.addEventListener('DOMContentLoaded', () => carregarMinhasCotacoes());
    </script>
</body>
</html>

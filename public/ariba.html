<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAESTRO | SAP Ariba</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
    if (!localStorage.getItem('maestro_session')) {
        window.location.href = 'index.html';
    }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 50px; 
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        /* FUNDO INFALÍVEL */
        .fundo-imagem {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; z-index: -2;
        }

        .fundo-escuro {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.65); z-index: -1;
        }

        .absolute-logo {
            position: fixed;
            top: 30px; 
            left: 40px; 
            z-index: 20; 
        }
        .absolute-logo img {
            height: 40px; 
            width: auto;
        }

        .control-panel {
            width: 100%;
            max-width: 360px;
            background: rgba(0, 0, 0, 0.15); 
            backdrop-filter: blur(6px); 
            -webkit-backdrop-filter: blur(6px); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px; 
            margin-top: 50px; 
            z-index: 10;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .status-container {
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
            font-size: 0.85rem; color: #555; background: #ffffff;
            padding: 10px 14px; border-radius: 6px; border: 1px solid #eaeaea; 
        }
        .led { width: 8px; height: 8px; border-radius: 50%; background-color: #999; transition: 0.3s; }
        .led.running { background-color: #004b91; box-shadow: 0 0 8px rgba(0,75,145,0.6); }

        /* 👇 BOTÕES SELECIONÁVEIS DAS EMPRESAS 👇 */
        .section-label { font-size: 0.75rem; font-weight: 600; color: #ccc; margin-bottom: 8px; display: block; text-transform: uppercase; }
        .grid-empresas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .btn-empresa {
            padding: 10px 5px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; border-radius: 6px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center;
        }
        .btn-empresa:hover { background: rgba(255,255,255,0.2); }
        .btn-empresa.active { background: #f5a623; color: #000; border-color: #f5a623; box-shadow: 0 0 10px rgba(245, 166, 35, 0.4); }

        /* Botões Principais */
        .btn-ligar {
            width: 100%; padding: 12px; background-color: #004b91; color: #ffffff; border: none;
            border-radius: 6px; font-size: 0.9rem; font-weight: 700; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 8px;
            margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0, 75, 145, 0.3);
        }
        .btn-ligar:hover:not(:disabled) { background-color: #00366b; }
        .btn-ligar:active:not(:disabled) { transform: translateY(2px); }
        .btn-ligar:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-ligar.running { background-color: #dc3545; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3); }
        .btn-ligar.running:hover { background-color: #c82333; }

        .btn-imprimir {
            width: 100%; padding: 12px; background-color: transparent; color: #f5a623;
            border: 1px solid #f5a623; border-radius: 6px; font-size: 0.85rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
            margin-bottom: 15px;
        }
        .btn-imprimir:hover { background-color: rgba(245, 166, 35, 0.1); }

        .btn-link {
            display: block; width: 100%; text-align: center; background: transparent;
            color: #ffffff; margin-top: 10px; font-size: 0.85rem; text-decoration: none; 
            border: none; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: 600;
        }
        .btn-link:hover { text-decoration: underline; }

        .mini-terminal {
            margin-top: 20px; background-color: #f8f9fa; border: 1px solid #eaeaea;
            border-radius: 6px; padding: 12px; font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem; color: #555; height: 110px; overflow-y: auto;
        }
        .log-line { margin-bottom: 5px; line-height: 1.4; }
        .log-time { color: #888; margin-right: 6px; }

        /* Navbar Global */
        .floating-navbar {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 17, 21, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px; padding: 6px 10px;
            display: flex; gap: 5px; z-index: 99999; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .nav-item {
            color: #9aa0a6; text-decoration: none; padding: 8px 18px; border-radius: 30px;
            font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
        .nav-item.active.nav-ariba { background: #f5a623; color: #000; box-shadow: 0 0 15px rgba(245, 166, 35, 0.4); }
        .nav-item.nav-voltar { color: #f87171; }
        .nav-item.nav-voltar:hover { color: #ff3d00; background: rgba(248, 113, 113, 0.15); }

        @media (max-width: 850px) {
            body { justify-content: center; padding: 100px 15px 120px 15px; align-items: flex-start; overflow-y: auto; }
            .absolute-logo { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); z-index: 20; width: 100%; display: flex; justify-content: center; margin-bottom: 20px;}
            .absolute-logo img { height: 35px; }
            .control-panel { padding: 20px; margin-top: 0; width: 100%; max-width: 340px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; }
            .status-container { justify-content: center; width: 100%; }
            .mini-terminal { text-align: left; width: 100%; }
            .floating-navbar { top: auto; bottom: 20px; width: max-content; max-width: 90%; }
            .nav-item span { display: none; } 
            .nav-item { padding: 12px; font-size: 16px; border-radius: 50%; }
        }
    </style>
</head>
<body onload="setupPainelAriba()">

    <img src="./img/ariba_fundo.png" class="fundo-imagem" alt="Fundo SAP Ariba">
    <div class="fundo-escuro"></div>

    <nav class="floating-navbar">
        <a href="coupa.html" class="nav-item"><i class="fa-solid fa-cube"></i> <span>Coupa</span></a>
        <a href="vale.html" class="nav-item"><i class="fa-solid fa-helmet-safety"></i> <span>Vale</span></a>
        <a href="me.html" class="nav-item"><i class="fa-solid fa-shopping-cart"></i> <span>ME</span></a>
        <a href="findes.html" class="nav-item"><i class="fa-solid fa-industry"></i> <span>Findes</span></a>
        <a href="ariba.html" class="nav-item active nav-ariba"><i class="fa-solid fa-cloud"></i> <span>Ariba</span></a>
        <a href="index.html" class="nav-item nav-voltar"><i class="fa-solid fa-arrow-left"></i> <span>Voltar</span></a>
    </nav>

    <div class="absolute-logo">
        <img src="./img/logo-sap-ariba.png" alt="Logo SAP Ariba">
    </div>

    <main class="control-panel">
        
        <div class="status-container">
            <div class="led" id="led-status"></div>
            <span id="txt-status">Ocioso</span>
        </div>


        <button class="btn-ligar" id="btn-iniciar" onclick="ligarRobo()">
            <i class="fa-solid fa-play"></i> INICIAR EXTRATOR
        </button>

        <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 15px; margin-bottom: 20px; color: #fff;">
                <h4 style="margin-bottom: 10px; font-size: 0.9rem; color: #f5a623;">Selecione as Empresas Prioritárias:</h4>
                <div style="display: flex; gap: 15px; font-size: 0.9rem; margin-bottom: 15px;">
                    <label><input type="checkbox" id="prio-alianca" value="1"> 1: ALIANÇA</label>
                    <label><input type="checkbox" id="prio-ventura" value="2"> 2: VENTURA</label>
                    <label><input type="checkbox" id="prio-uniao" value="3"> 3: UNIÃO</label>
                </div>
            </div>

        <button class="btn-imprimir" id="btn-imprimir" onclick="solicitarImpressao()">
            <i class="fa-solid fa-print"></i> Imprimir Arquivos
        </button>

        <a href="index.html" class="btn-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Maestro
        </a>

        <div class="mini-terminal" id="mini-terminal">
            <div class="log-line"><span class="log-time">[Sys]</span> Conectando ao Maestro...</div>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const sessionAtual = localStorage.getItem('maestro_session');
        const socket = io({ auth: { sessionId: sessionAtual } });
        const MEU_PORTAL = 'ariba';

        socket.on("sessao_invalida", () => {
            console.error("A sua sessão expirou ou é inválida.");
            localStorage.clear();
            window.location.href = "index.html"; 
        });

        let isRunning = false;
        const empresas_ativas = { ventura: false, hse: false, hse_es: false };

        function setupPainelAriba() {
            socket.emit('sou_frontend', { usuario: localStorage.getItem('maestro_user') });
            addLog("Módulo SAP Ariba carregado e pronto.");
        }

        // Lógica de seleção dos botões das empresas
        document.querySelectorAll('.btn-empresa').forEach(btn => {
            btn.addEventListener('click', () => {
                const id_emp = btn.id.split('-')[1]; 
                empresas_ativas[id_emp] = !empresas_ativas[id_emp]; 
                btn.classList.toggle('active'); 
            });
        });

        function alternarEstadoAriba() {
            if (!isRunning) {
                if(confirm("Deseja iniciar o robô do SAP Ariba com as empresas selecionadas?")) {
                    socket.emit('comando_direto', { 
                        modo: 'ligar_robo', 
                        portal: MEU_PORTAL,
                        empresas: empresas_ativas 
                    });
                }
            } else {
                if(confirm("Deseja fechar o navegador e desligar o robô SAP Ariba?")) {
                    socket.emit('comando_direto', { modo: 'desligar_robo', portal: MEU_PORTAL });
                    const btn = document.getElementById('btn-iniciar');
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> DESLIGANDO...';
                    btn.disabled = true;
                }
            }
        }

        function solicitarImpressao() {
            let opcao = prompt("🖨️ Selecione a Impressora:\n\nDigite 1 para: Lex611\nDigite 2 para: HP LaserJet P205X\n\n(Digite 1 ou 2 e pressione OK)", "1");
            let impressoraEscolhida = "";
            if (opcao === "1") { impressoraEscolhida = "Lex611"; } 
            else if (opcao === "2") { impressoraEscolhida = "HP LaserJet P205X series PCL6 Class Driver"; } 
            else { return; } 

            if(confirm(`Deseja imprimir TODOS os relatórios do ARIBA na impressora:\n👉 ${impressoraEscolhida}?`)) {
                socket.emit('solicitar_impressao', { portal: 'ariba', impressora: impressoraEscolhida }); 
                addLog(`Ordem de impressão enviada para a ${impressoraEscolhida}.`);
            }
        }

        // Mini Terminal
        function addLog(msg) {
            const term = document.getElementById('mini-terminal');
            if (term) {
                const now = new Date();
                const hora = now.getHours().toString().padStart(2, '0') + ':' + 
                             now.getMinutes().toString().padStart(2, '0');
                
                term.innerHTML += `<div class="log-line"><span class="log-time">[${hora}]</span> ${msg}</div>`;
                while (term.childElementCount > 50) term.removeChild(term.firstChild);
                term.scrollTop = term.scrollHeight;
            }
        }

        socket.on('relatar_progresso_ariba', (dados) => {
            if (dados.mensagem) addLog(dados.mensagem);
        });

        // Escuta o estado independente do Ariba
        socket.on('sincronizar_estado_ariba', (estado) => {
            const btnLigar = document.getElementById('btn-iniciar');
            const led = document.getElementById('led-status');
            const txtStatus = document.getElementById('txt-status');

            btnLigar.disabled = false;

            if (estado.status === 'desligado') {
                isRunning = false;
                led.className = "led";
                txtStatus.innerText = "Ocioso";
                btnLigar.className = "btn-ligar";
                btnLigar.innerHTML = '<i class="fa-solid fa-play"></i> INICIAR EXTRATOR';
            } else if (estado.status === 'logando') {
                isRunning = true;
                led.className = "led running";
                txtStatus.innerText = "Autenticando...";
                btnLigar.className = "btn-ligar running";
                btnLigar.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> AUTENTICANDO...';
                btnLigar.disabled = true;
            } else if (estado.status === 'ocioso') {
                isRunning = true;
                led.className = "led running";
                txtStatus.innerText = "Navegador Ativo";
                btnLigar.className = "btn-ligar running";
                btnLigar.innerHTML = '<i class="fa-solid fa-stop"></i> DESLIGAR MÓDULO';
            }
        });

        // Substitua ou adicione a função ligarRobo
       function ligarRobo() {
            if (isRunning) {
                if(confirm("Deseja fechar o executável e desligar o robô SAP Ariba?")) {
                    socket.emit('comando_para_robo', { portal: 'ariba', modo: 'desligar_robo' });
                    const btn = document.getElementById('btn-iniciar');
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> DESLIGANDO...';
                    btn.disabled = true;
                }
                return;
            }

            // Pega os checkboxes
            let prioridades = [];
            if(document.getElementById('prio-alianca').checked) prioridades.push("1");
            if(document.getElementById('prio-ventura').checked) prioridades.push("2");
            if(document.getElementById('prio-uniao').checked) prioridades.push("3");
            
            let prioStr = prioridades.join(" "); 
            
            if(confirm("Deseja iniciar o robô do SAP Ariba com as empresas selecionadas?")) {
                socket.emit('comando_para_robo', {
                    portal: 'ariba',
                    modo: 'ligar_robo',
                    prioridades: prioStr
                });
            }
        }

        function solicitarImpressao() {
            // 1ª Pergunta: Qual Cliente?
            let opCliente = prompt("🏢 Qual cliente deseja imprimir?\n\nDigite 1 para: AEGEA\nDigite 2 para: ESTÁCIO\n\n(Digite 1 ou 2 e pressione OK)", "1");
            let cliente = "";
            let nomeCliente = "";
            if (opCliente === "1") { cliente = "aegea"; nomeCliente = "AEGEA"; }
            else if (opCliente === "2") { cliente = "estacio"; nomeCliente = "ESTÁCIO"; }
            else { return; } // Se o utilizador cancelar, para por aqui.

            // 2ª Pergunta: Qual Impressora?
            let opcao = prompt("🖨️ Selecione a Impressora:\n\nDigite 1 para: Lex611\nDigite 2 para: HP LaserJet P205X\n\n(Digite 1 ou 2 e pressione OK)", "1");
            let impressoraEscolhida = "";
            if (opcao === "1") { impressoraEscolhida = "Lex611"; } 
            else if (opcao === "2") { impressoraEscolhida = "HP LaserJet P205X series PCL6 Class Driver"; } 
            else { return; } 

            // Confirmação Final e Envio
            if(confirm(`Deseja imprimir TODOS os relatórios da ${nomeCliente} na impressora:\n👉 ${impressoraEscolhida}?`)) {
                socket.emit('solicitar_impressao', { portal: 'ariba', cliente: cliente, impressora: impressoraEscolhida }); 
                addLog(`Ordem enviada: ${nomeCliente} -> ${impressoraEscolhida}.`);
            }
        }

        // Função para imprimir pastas específicas do Ariba
        function imprimirAriba(cliente) {
            const opcao = document.getElementById('impressora-ariba').value;
            let impressoraEscolhida = "";
            if (opcao === "1") { impressoraEscolhida = "Lex611"; } 
            else if (opcao === "2") { impressoraEscolhida = "HP LaserJet P205X series PCL6 Class Driver"; }
            
            const nomeCliente = cliente === 'aegea' ? 'AEGEA' : 'ESTÁCIO';
            
            if(confirm(`Deseja imprimir TODOS os relatórios da ${nomeCliente} na impressora:\n👉 ${impressoraEscolhida}?`)) {
                socket.emit('solicitar_impressao', { portal: 'ariba', cliente: cliente, impressora: impressoraEscolhida });
                
                // Manda um log visual se existir a div de logs
                const term = document.getElementById('terminal-logs');
                if(term) {
                    term.innerHTML += `<div style="color: #cbd5e1;">> Enviando pasta ${nomeCliente} para a impressora...</div>`;
                }
            }
        }
    </script>
</body>
</html>

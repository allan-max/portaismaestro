<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção</title>
    <script>
    if (!localStorage.getItem('maestro_session')) {
        window.location.href = 'index.html';
    }
</script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            position: relative;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        p {
            margin: 0;
            font-size: 15px;
            opacity: 0.85;
        }

        .status {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.6;
        }

        .voltar {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 14px;
        }

        .voltar a {
            color: #ffffff;
            text-decoration: none;
            opacity: 0.8;
        }

        .voltar a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="voltar">
        <a href="index.html">← Voltar</a>
    </div>

    <div class="container">
        <h1>🚧 Estamos em manutenção</h1>
        <p>Nosso sistema está passando por melhorias.</p>
        <div class="status">
            Status: Atualização em andamento...
        </div>
    </div>

</body>
</html>

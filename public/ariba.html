<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAESTRO | SAP Ariba</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
    if (!localStorage.getItem('maestro_session')) {
        window.location.href = 'index.html';
    }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* 👇 FUNDO IGUAL AO FINDES (Mudando apenas o nome da imagem) 👇 */
        body { 
            display: flex; height: 100vh; overflow: hidden; 
            background-image: url('img/ariba_fundo.png'); 
            background-size: cover; background-position: center;
        }

        /* LADO ESQUERDO (VISUAL SAP) */
        .left-pane {
            flex: 1.2;
            background: linear-gradient(135deg, rgba(0,20,40,0.9) 0%, rgba(0,75,145,0.9) 100%);
            color: white; padding: 50px;
            display: flex; flex-direction: column; justify-content: center; position: relative;
        }
        .left-pane::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; pointer-events: none;
        }
        .logo-ariba { position: absolute; top: 40px; left: 50px; font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; }
        .logo-ariba span { color: #f5a623; } /* Destaque SAP */
        
        .hero-text { font-size: 3rem; line-height: 1.2; font-weight: 300; max-width: 600px; z-index: 1; }
        .hero-text strong { font-weight: 800; }

        /* LADO DIREITO (CONTROLES) */
        .right-pane {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 40px; position: relative;
        }
        
        /* 👇 CAIXA DE CONTROLE ESTILO FINDES 👇 */
        .control-panel { 
            width: 100%; max-width: 420px; 
            background: rgba(255, 255, 255, 0.95);
            padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid #eaeaea; /* Borda igual do Findes */
        }
        .control-panel h2 { font-size: 1.5rem; color: #1a1a1a; margin-bottom: 25px; font-weight: 600; border-bottom: 1px solid #eaeaea; padding-bottom: 15px; }

        /* Status LED */
        .status-container {
            display: flex; align-items: center; gap: 10px; margin-bottom: 25px;
            font-size: 0.9rem; color: #555; background: #f8f9fa; padding: 10px 15px;
            border-radius: 6px; border: 1px solid #eaeaea;
        }
        .led { width: 10px; height: 10px; border-radius: 50%; background-color: #999; }
        .led.active { background-color: #004b91; box-shadow: 0 0 8px rgba(0,75,145,0.6); }

        /* 👇 BOTÕES SELECIONÁVEIS DAS EMPRESAS 👇 */
        .section-label { font-size: 0.8rem; font-weight: 600; color: #666; margin-bottom: 10px; display: block; text-transform: uppercase; }
        .grid-empresas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .btn-empresa {
            padding: 12px 5px; border: 1px solid #ccc; background: #fff; color: #555;
            border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; text-align: center;
        }
        .btn-empresa:hover { background: #f0f4ff; border-color: #004b91; color: #004b91; }
        .btn-empresa.active { background: #004b91; color: #fff; border-color: #004b91; box-shadow: 0 4px 10px rgba(0,75,145,0.3); }

        /* Botões de Ação */
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 15px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background-color: #004b91; color: #ffffff; }
        .btn-primary:hover:not(:disabled) { background-color: #00366b; }
        .btn-stop { background-color: #dc3545; color: #ffffff; }
        .btn-stop:hover:not(:disabled) { background-color: #c82333; }
        .btn-outline { background-color: transparent; border: 1px solid #004b91; color: #004b91; }
        .btn-outline:hover:not(:disabled) { background-color: #f0f4ff; }
        
        .btn-link { background-color: transparent; color: #666; margin-top: 10px; font-size: 0.9rem; text-decoration: none; border: none; width: auto; }
        .btn-link:hover { color: #1a1a1a; text-decoration: underline; }

        /* 👇 TERMINAL/LOG IGUAL AO FINDES 👇 */
        .log-section {
            width: 100%; max-width: 420px; margin-top: 20px;
            background: #1a1a1a; border-radius: 8px; padding: 15px;
            border: 2px solid #eaeaea; /* Borda igual do Findes */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .log-header { color: #fff; font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .log-terminal {
            width: 100%; height: 180px; overflow-y: auto;
            color: #dcdcdc; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.8rem;
            line-height: 1.5; padding-right: 5px;
        }
        .log-terminal::-webkit-scrollbar { width: 6px; }
        .log-terminal::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        /* Overlay Lock */
        .overlay-lock {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); color: #fff; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: all 0.4s; z-index: 10;
        }
        .overlay-lock i { font-size: 3rem; margin-bottom: 15px; color: #ef4444; }
    </style>
</head>
<body>
    <div class="left-pane">
        <div class="logo-ariba">MAESTRO / <span>ARIBA</span></div>
        <h1 class="hero-text">Central de Automação de Cotações <strong>SAP Ariba</strong>.</h1>
    </div>

    <div class="right-pane">
        <div id="overlay-lock" class="overlay-lock">
            <i class="fa-solid fa-lock"></i>
            <p>Servidor ocupado por outro portal</p>
        </div>

        <div class="control-panel">
            <h2>Módulo SAP Ariba</h2>
            
            <div class="status-container">
                <div id="indicador-status" class="led"></div>
                <span id="txt-status">Aguardando início...</span>
            </div>

            <label class="section-label">Empresas Prioritárias</label>
            <div class="grid-empresas">
                <button class="btn-empresa" id="emp-ventura">VENTURA</button>
                <button class="btn-empresa" id="emp-uniao">UNIÃO</button>
                <button class="btn-empresa" id="emp-alianca">ALIANÇA</button>
            </div>

            <button class="btn btn-primary" id="btn-iniciar">
                <i class="fa-solid fa-play"></i> INICIAR EXTRATOR (ARIBA)
            </button>
            
            <button class="btn btn-outline" id="btn-imprimir">
                <i class="fa-solid fa-print"></i> IMPRIMIR RELATÓRIOS
            </button>

            <button class="btn btn-link" id="btn-desligar">Desligar Robô</button>
        </div>

        <div class="log-section">
            <div class="log-header">
                <i class="fa-solid fa-terminal"></i> Terminal de Progresso (ARIBA)
            </div>
            <div id="terminal-logs" class="log-terminal">
                <div>> Pronto para operar.</div>
            </div>
        </div>
        
        <a href="dashboard.html" class="btn btn-link" style="margin-top: 15px; position: absolute; bottom: 20px;">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard
        </a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const sessionAtual = localStorage.getItem('maestro_session');
        const socket = io({ auth: { sessionId: sessionAtual } });
        const MEU_PORTAL = 'ariba';

        const empresas_ativas = { ventura: false, hse: false, hse_es: false };

        // Lógica de seleção dos botões das empresas
        document.querySelectorAll('.btn-empresa').forEach(btn => {
            btn.addEventListener('click', () => {
                const id_emp = btn.id.split('-')[1]; 
                empresas_ativas[id_emp] = !empresas_ativas[id_emp]; 
                btn.classList.toggle('active'); 
            });
        });

        // Eventos dos botões principais
        document.getElementById('btn-iniciar').addEventListener('click', () => {
            addLog("Solicitando início do robô SAP Ariba...");
            socket.emit('comando_direto', { 
                modo: 'ligar_robo', 
                portal: MEU_PORTAL,
                empresas: empresas_ativas 
            });
        });

        document.getElementById('btn-imprimir').addEventListener('click', solicitarImpressao);

        function desligarRobo() {
            if(confirm("Deseja fechar o navegador e desligar o robô SAP Ariba?")) {
                socket.emit('comando_direto', { modo: 'desligar_robo', portal: MEU_PORTAL });
                const btnLigar = document.getElementById('btn-iniciar');
                btnLigar.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> DESLIGANDO...';
                btnLigar.disabled = true;
            }
        }

        // 👇 AQUI ESTÁ O SEGREDO: Ele agora escuta o seu estado independente! 👇
        socket.on('sincronizar_estado_ariba', (estado) => {
            const dot = document.getElementById('indicador-status');
            const txt = document.getElementById('txt-status');
            const overlayLock = document.getElementById('overlay-lock');
            const btnLigar = document.getElementById('btn-iniciar');

            dot.className = "led"; 
            
            // O Cadeado de Intertravamento morre aqui! Ele fica sempre escondido.
            if(overlayLock) { overlayLock.style.opacity = '0'; overlayLock.style.pointerEvents = 'none'; }
            btnLigar.disabled = false;

            if (estado.status === 'desligado') {
                dot.classList.add("offline");
                txt.innerText = "Aguardando início...";
                btnLigar.className = 'btn btn-primary';
                btnLigar.innerHTML = '<i class="fa-solid fa-play"></i> INICIAR EXTRATOR (ARIBA)';
                btnLigar.onclick = function() {
                    socket.emit('comando_direto', { modo: 'ligar_robo', portal: MEU_PORTAL, empresas: empresas_ativas });
                };
            } else if (estado.status === 'logando') {
                dot.classList.add("active");
                txt.innerText = "Autenticando no SAP Ariba...";
                btnLigar.disabled = true;
                btnLigar.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> AUTENTICANDO...';
            } else if (estado.status === 'ocioso') {
                dot.classList.add("active");
                txt.innerText = "Navegador operacional.";
                btnLigar.className = 'btn btn-stop';
                btnLigar.innerHTML = '<i class="fa-solid fa-power-off"></i> DESLIGAR NAVEGADOR';
                btnLigar.onclick = desligarRobo;
            }
        });

        // Logs do Python
        socket.on('relatar_progresso_ariba', (dados) => {
            if (dados.mensagem) addLog(dados.mensagem);
        });

        function addLog(msg) {
            const terminal = document.getElementById('terminal-logs');
            const agora = new Date().toLocaleTimeString();
            terminal.innerHTML += `<div style="margin-top: 4px; color: #a2adb7;">> ${agora} - ${msg}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Função de Impressão
        function solicitarImpressao() {
            let opcao = prompt("🖨️ Selecione a Impressora:\n\nDigite 1 para: Lex611\nDigite 2 para: HP LaserJet P205X\n\n(Digite 1 ou 2 e pressione OK)", "1");
            let impressoraEscolhida = "";
            if (opcao === "1") { impressoraEscolhida = "Lex611"; } 
            else if (opcao === "2") { impressoraEscolhida = "HP LaserJet P205X series PCL6 Class Driver"; } 
            else { return; } 

            if(confirm(`Deseja imprimir TODOS os relatórios do ARIBA na impressora:\n👉 ${impressoraEscolhida}?`)) {
                socket.emit('solicitar_impressao', { portal: 'ariba', impressora: impressoraEscolhida }); 
                addLog(`Enviando comando para imprimir na ${impressoraEscolhida}...`);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAESTRO | Planilha Vale</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
    if (!localStorage.getItem('maestro_session')) {
        window.location.href = 'index.html';
    }
    
    function irPara(url) {
        window.location.href = url;
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #fff;
            display: flex;
            height: 100vh;
            width: 100%;
        }
        
        /* ========================================== */
        /* 🧭 NAVBAR FLUTUANTE GLOBAL                 */
        /* ========================================== */
        .floating-navbar {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 17, 21, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px; padding: 6px 10px;
            display: flex; gap: 5px; z-index: 99999; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .nav-item {
            color: #9aa0a6; text-decoration: none; padding: 8px 12px; border-radius: 30px;
            font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
        .nav-item.active.nav-planilha { background: #21a366; color: #fff; box-shadow: 0 0 15px rgba(33, 163, 102, 0.5); }
        .nav-item.nav-voltar { color: #f87171; }
        .nav-item.nav-voltar:hover { color: #ff3d00; background: rgba(248, 113, 113, 0.15); }

        .nav-voltar { background: rgba(255, 255, 255, 0.1); }
        .nav-voltar:hover { background: rgba(255, 255, 255, 0.2); }

        /* ========================================== */
        /* 📱 RESPONSIVIDADE MOBILE                     */
        /* ========================================== */
        @media (max-width: 850px) {
            .floating-navbar {
                top: auto;
                bottom: 20px;
                width: max-content;
                max-width: 90%;
            }
            .nav-item span { display: none; } 
            .nav-item { padding: 12px; font-size: 16px; border-radius: 50%; }
        }
    </style>
</head>
<body>
    <nav class="floating-navbar">
        <a href="javascript:void(0)" onclick="irPara('coupa.html')" class="nav-item"><i class="fa-solid fa-cube"></i> <span>Coupa</span></a>
        <a href="javascript:void(0)" onclick="irPara('vale.html')" class="nav-item"><i class="fa-solid fa-helmet-safety"></i> <span>Vale</span></a>
        <a href="javascript:void(0)" onclick="irPara('planilha_vale.html')" class="nav-item active nav-planilha"><i class="fa-solid fa-file-excel"></i> <span>Planilha</span></a>
        <a href="javascript:void(0)" onclick="irPara('me.html')" class="nav-item"><i class="fa-solid fa-shopping-cart"></i> <span>ME</span></a>
        <a href="javascript:void(0)" onclick="irPara('findes.html')" class="nav-item"><i class="fa-solid fa-industry"></i> <span>Findes</span></a>
        <a href="javascript:void(0)" onclick="irPara('ariba.html')" class="nav-item"><i class="fa-solid fa-cloud"></i> <span>Ariba</span></a>
        <a href="index.html" class="nav-item nav-voltar"><i class="fa-solid fa-arrow-left"></i> <span>Voltar</span></a>
    </nav>
    <!-- CONTEÚDO PRINCIPAL -->
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div class="glass-box" style="background: rgba(30, 30, 50, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 30px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="font-size: 3rem; color: #21a366; margin-bottom: 10px;">
                <i class="fa-solid fa-file-excel"></i>
            </div>
            <h2 style="font-size: 1.5rem; margin-bottom: 5px; font-weight: 700;">Atribuir Vendedor</h2>
            <p style="font-size: 0.9rem; color: #a1a1aa; margin-bottom: 25px;">Registre o vendedor para as cotações na planilha da Vale.</p>
            
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; text-transform: uppercase;">Nome do Vendedor</label>
                <input type="text" id="input-vendedor" placeholder="Ex: João Silva" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; box-sizing: border-box;" onfocus="this.style.borderColor='#21a366'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'">
            </div>

            <div style="text-align: left; margin-bottom: 25px;">
                <label style="display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; text-transform: uppercase;">Números das Cotações</label>
                <textarea id="input-cotacoes" placeholder="Ex: 22222, 33333, 44444&#10;Pode separar por vírgula ou espaço" rows="3" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; box-sizing: border-box; resize: none; font-family: 'Roboto Mono', monospace;" onfocus="this.style.borderColor='#21a366'" onblur="this.style.borderColor='rgba(255,255,255,0.15)'"></textarea>
            </div>

            <button id="btn-registrar" onclick="registrarVendedor()" style="width: 100%; padding: 14px; border-radius: 8px; border: none; background: #21a366; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(33, 163, 102, 0.4);">
                REGISTRAR NA PLANILHA
            </button>

            <div id="status-msg" style="margin-top: 15px; font-size: 0.9rem; min-height: 20px; font-weight: 500;"></div>
        </div>
    </div>

    <script>
        const sessionAtual = localStorage.getItem('maestro_session');
        const socket = io({ auth: { sessionId: sessionAtual }, transports: ['websocket'], upgrade: false });

        socket.emit('sou_frontend', { sessionId: sessionAtual });

        socket.on("sessao_invalida", () => {
            localStorage.clear();
            window.location.href = "index.html"; 
        });

        function registrarVendedor() {
            const vendedor = document.getElementById('input-vendedor').value.trim();
            const cotacoes = document.getElementById('input-cotacoes').value.trim();
            const btn = document.getElementById('btn-registrar');
            const msg = document.getElementById('status-msg');

            if (!vendedor || !cotacoes) {
                msg.style.color = '#f87171';
                msg.innerText = "⚠️ Preencha o vendedor e as cotações.";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> REGISTRANDO...';
            msg.style.color = '#fbbf24';
            msg.innerText = "⏳ Enviando para o Robô...";

            socket.emit('solicitar_registro_vendedor_cotacao', { vendedor, cotacoes });
        }

        socket.on('status_registro_vendedor', (res) => {
            const msg = document.getElementById('status-msg');
            msg.style.color = '#fbbf24';
            msg.innerHTML = '<i class="fa-solid fa-clock"></i> ' + res.mensagem;
        });

        socket.on('resposta_registro_vendedor_cotacao', (res) => {
            const btn = document.getElementById('btn-registrar');
            const msg = document.getElementById('status-msg');
            
            btn.disabled = false;
            btn.innerHTML = 'REGISTRAR NA PLANILHA';

            if (res.sucesso) {
                msg.style.color = '#34d399';
                msg.innerHTML = '<i class="fa-solid fa-check"></i> ' + res.mensagem;
                document.getElementById('input-vendedor').value = '';
                document.getElementById('input-cotacoes').value = '';
            } else {
                msg.style.color = '#f87171';
                msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Erro: ' + res.erro;
            }
        });

        // Lógica da Fila de Extração
        socket.emit('obter_fila_extracao', {clientId: socket.id});
        
        socket.on('atualizar_fila_extracao', (res) => {
            const panel = document.getElementById('fila-extracao-panel');
            const lista = document.getElementById('fila-lista');
            const fila = res.fila || [];
            
            if (fila.length > 0) {
                panel.style.display = 'flex';
                let agrupado = {};
                fila.forEach(item => {
                    if (!agrupado[item.vendedor]) agrupado[item.vendedor] = [];
                    agrupado[item.vendedor].push(item.cotacao);
                });
                
                let html = '';
                for (let vend in agrupado) {
                    html += `<div style="background: #2d2d2d; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                        <div style="color: #3b82f6; font-weight: bold; margin-bottom: 5px;"><i class="fa-solid fa-user"></i> ${vend}</div>
                        <div style="color: #d1d5db; font-size: 13px; line-height: 1.4;">${agrupado[vend].join(', ')}</div>
                    </div>`;
                }
                lista.innerHTML = html;
                document.getElementById('btn-extrair-fila').disabled = false;
                document.getElementById('btn-extrair-fila').style.background = '#2563eb';
                document.getElementById('btn-extrair-fila').innerHTML = '<i class="fa-solid fa-play"></i> EXTRAIR TUDO AGORA';
            } else {
                panel.style.display = 'none';
            }
        });
        
        socket.on('progresso_fila_extracao', (res) => {
            const msg = document.getElementById('fila-status');
            msg.innerHTML = res.mensagem;
        });

        function iniciarExtracaoFila() {
            document.getElementById('btn-extrair-fila').disabled = true;
            document.getElementById('btn-extrair-fila').style.background = '#6b7280';
            document.getElementById('btn-extrair-fila').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PROCESSANDO...';
            document.getElementById('fila-status').innerHTML = '<span style="color: #fbbf24;">Iniciando processo...</span>';
            socket.emit('iniciar_extracao_fila', {clientId: socket.id});
        }
    </script>
    
    <!-- Fila Panel UI -->
    <div id="fila-extracao-panel" style="position: fixed; right: 20px; top: 100px; width: 320px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 20px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <h3 style="color: #fff; margin-top: 0; font-size: 16px; border-bottom: 1px solid #374151; padding-bottom: 15px; margin-bottom: 15px;"><i class="fa-solid fa-layer-group"></i> Fila de Extração Pendente</h3>
        <p style="color: #9ca3af; font-size: 12px; margin-bottom: 15px;">Os vendedores e cotações abaixo não estavam na planilha. Clique no botão abaixo quando tiver terminado de registrar todos.</p>
        <div id="fila-lista" style="flex: 1; max-height: 400px; overflow-y: auto; margin-bottom: 15px;"></div>
        <div id="fila-status" style="font-size: 13px; margin-bottom: 15px; font-weight: bold;"></div>
        <button id="btn-extrair-fila" onclick="iniciarExtracaoFila()" style="background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s;"><i class="fa-solid fa-play"></i> EXTRAIR TUDO AGORA</button>
    </div>
</body>
</html>
